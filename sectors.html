<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
<meta http-equiv="Pragma" content="no-cache" />
<meta http-equiv="Expires" content="0" />
<title>慢慢变富 · 板块行情</title>
<style>
  :root {
    --primary: #E03025;
    --primary-soft: #fff0f0;
    --up: #E03025;
    --down: #16a34a;
    --bg: #f3f4f6;
    --card: #ffffff;
    --border: #e5e7eb;
    --text: #1f2937;
    --text-2: #6b7280;
    --text-3: #9ca3af;
    --radius: 12px;
    --radius-lg: 16px;
    --shadow: 0 1px 2px rgba(0,0,0,.04), 0 1px 3px rgba(0,0,0,.06);
    --font: -apple-system, BlinkMacSystemFont, "PingFang SC", "Helvetica Neue", sans-serif;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    font-family: var(--font); background: var(--bg); color: var(--text);
    font-size: 14px; line-height: 1.5; -webkit-font-smoothing: antialiased;
    padding-bottom: 120px;
    padding-bottom: calc(120px + env(safe-area-inset-bottom));
  }
  .wrap { max-width: 960px; margin: 0 auto; padding: 0 16px 40px; padding: 0 16px calc(40px + env(safe-area-inset-bottom)); }

  /* ---- Top bar ---- */
  .topbar {
    position: sticky; top: 0; z-index: 30;
    background: rgba(255,255,255,.9); backdrop-filter: saturate(180%) blur(10px);
    border-bottom: 1px solid var(--border);
  }
  .topbar-inner {
    max-width: 960px; margin: 0 auto; padding: 12px 16px;
    display: flex; align-items: center; gap: 12px;
  }
  .brand { display: flex; align-items: center; gap: 8px; font-weight: 700; font-size: 16px; }
  .brand-icon {
    width: 30px; height: 30px; border-radius: 8px;
    background: linear-gradient(135deg, #E03025, #f0654f); color: #fff;
    display: grid; place-items: center; font-size: 15px; box-shadow: var(--shadow);
  }
  .topbar-actions { margin-left: auto; display: flex; align-items: center; gap: 8px; }
  .link-like {
    font-family: var(--font); font-size: 13px; color: var(--text-2);
    background: transparent; border: none; cursor: pointer; padding: 6px 8px; border-radius: 8px;
  }
  .link-like:hover { background: #f3f4f6; color: var(--text); }
  .link-like:disabled, .link-like.disabled { color: var(--text-3); opacity: .6; cursor: not-allowed; }

  /* ---- Sub bar (market status) ---- */
  .subbar { background: #fff; border-bottom: 1px solid var(--border); }
  .subbar-inner {
    max-width: 960px; margin: 0 auto; padding: 8px 16px;
    display: flex; align-items: center; justify-content: space-between; gap: 12px;
  }
  .market-status { display: flex; align-items: center; gap: 6px; font-size: 13px; color: var(--text-2); }
  .market-dot { width: 8px; height: 8px; border-radius: 50%; background: #d1d5db; flex-shrink: 0; }
  .market-dot.open { background: var(--down); box-shadow: 0 0 0 2px rgba(22,163,74,.15); }
  .refresh-set { display: flex; align-items: center; gap: 8px; font-size: 13px; color: var(--text-2); }
  .refresh-chips { display: flex; gap: 4px; }
  .refresh-chips button {
    font-family: var(--font); font-size: 12px; font-weight: 600; color: var(--text-2);
    padding: 4px 10px; border: 1px solid var(--border); border-radius: 999px; background: #fff; cursor: pointer; transition: .15s;
  }
  .refresh-chips button:hover { border-color: var(--text-2); }
  .refresh-chips button.active { background: var(--primary); color: #fff; border-color: var(--primary); }

  /* ---- 顶部指数栏 ---- */
  .indices-bar {
    display: flex; align-items: center; gap: 0; flex-wrap: wrap;
    margin: 14px 0 0; padding: 8px 10px;
    background: var(--card, #fff); border: 1px solid var(--border, #e5e7eb);
    border-radius: var(--radius, 12px); box-shadow: var(--shadow, none);
    font-size: 12px;
  }
  .indices-bar .idx-item {
    flex: 1 1 100%; min-width: 0; display: flex; flex-direction: row;
    align-items: baseline; gap: 4px; white-space: nowrap;
    padding: 5px 0; border-bottom: 1px solid var(--border, #e5e7eb);
  }
  .indices-bar .idx-item:last-of-type { border-bottom: none; }
  .indices-bar .idx-name { font-size: 11px; color: var(--text-2, #6b7280); flex: 0 0 auto; }
  .indices-bar .idx-val {
    font-size: 14px; font-weight: 700; color: var(--text, #1f2937);
    font-variant-numeric: tabular-nums; line-height: 1.1;
  }
  .indices-bar .idx-chg {
    font-size: 11px; font-weight: 600; font-variant-numeric: tabular-nums;
    flex: 0 0 auto;
  }
  .indices-bar .idx-chg.up { color: #E03025; }
  .indices-bar .idx-chg.down { color: #16a34a; }
  .indices-bar .idx-chg.flat { color: #9ca3af; }
  .indices-bar .idx-abs {
    font-size: 11px; font-weight: 600; font-variant-numeric: tabular-nums;
    flex: 0 0 auto; margin-left: 2px;
  }
  .indices-bar .idx-abs.up { color: #E03025; }
  .indices-bar .idx-abs.down { color: #16a34a; }
  .indices-bar .idx-abs.flat { color: #9ca3af; }
  .indices-bar .idx-time {
    flex: 0 0 100%; margin-top: 2px; padding-top: 4px;
    font-size: 10px; color: #9ca3af; font-variant-numeric: tabular-nums;
    white-space: nowrap; text-align: right;
    border-top: 1px solid var(--border, #e5e7eb);
  }
  @media (min-width: 560px) {
    .indices-bar { flex-wrap: nowrap; padding: 8px 12px; }
    .indices-bar .idx-item {
      flex: 1 1 0; padding: 0 10px; border-bottom: none;
      border-right: 1px solid var(--border, #e5e7eb);
    }
    .indices-bar .idx-item:last-of-type { border-right: none; }
    .indices-bar .idx-name { font-size: 12px; }
    .indices-bar .idx-val { font-size: 15px; }
    .indices-bar .idx-chg { font-size: 12px; }
    .indices-bar .idx-abs { font-size: 12px; }
    .indices-bar .idx-time {
      flex: 0 0 auto; margin-left: auto; margin-top: 0; padding-top: 0; padding-left: 12px;
      text-align: right; border-top: none; border-left: 1px solid var(--border, #e5e7eb);
    }
  }

  /* ---- 板块页特定样式 ---- */
  .sec-header {
    margin-top: 14px;
    background: var(--card); border: 1px solid var(--border); border-radius: var(--radius);
    padding: 14px 16px; box-shadow: var(--shadow);
    display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
  }
  .sec-header-title {
    font-size: 16px; font-weight: 800; display: flex; align-items: center; gap: 6px;
  }
  .sec-header-title::before {
    content: ""; width: 4px; height: 16px; background: var(--primary); border-radius: 2px;
  }
  .sec-tag {
    display: inline-flex; align-items: center; gap: 4px;
    font-size: 11px; font-weight: 700;
    padding: 3px 8px; border-radius: 999px;
    background: #fef3c7; color: #b45309;
  }
  .sec-tag.live { background: #dcfce7; color: #15803d; }
  .sec-tag.idle { background: #f3f4f6; color: var(--text-2); }
  .sec-count {
    margin-left: auto; font-size: 12px; color: var(--text-2);
    background: #f9fafb; border: 1px solid var(--border); border-radius: 999px;
    padding: 3px 10px;
  }
  .sec-count b { color: var(--text); font-weight: 800; margin: 0 2px; font-variant-numeric: tabular-nums; }

  /* 涨跌统计 */
  .sec-summary { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-top: 10px; }
  .sec-sum-item {
    background: var(--card); border: 1px solid var(--border); border-radius: var(--radius);
    padding: 8px 4px; text-align: center;
  }
  .sec-sum-item .v { font-size: 16px; font-weight: 800; font-variant-numeric: tabular-nums; }
  .sec-sum-item .v.up { color: var(--up); }
  .sec-sum-item .v.down { color: var(--down); }
  .sec-sum-item .v.flat { color: var(--text-2); }
  .sec-sum-item .l { font-size: 11px; color: var(--text-3); margin-top: 2px; }

  /* 过滤 Tab */
  .cat-pills { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; }
  .pill {
    font-family: var(--font); font-size: 13px; font-weight: 600; color: var(--text-2);
    padding: 6px 14px; border-radius: 999px; border: 1px solid var(--border);
    background: #fff; cursor: pointer; transition: .15s;
  }
  .pill.active { background: var(--primary); color: #fff; border-color: var(--primary); }
  .pill:hover:not(.active) { border-color: var(--text-2); }

  /* 板块网格 */
  .sec-grid {
    margin-top: 12px;
    display: grid; grid-template-columns: 1fr 1fr; gap: 8px;
  }
  @media (min-width: 600px) {
    .sec-grid { grid-template-columns: repeat(3, 1fr); }
  }
  @media (min-width: 880px) {
    .sec-grid { grid-template-columns: repeat(4, 1fr); }
  }
  .sec-card {
    background: var(--card); border: 1px solid var(--border); border-radius: var(--radius);
    padding: 11px 12px; display: flex; align-items: center; gap: 8px;
    text-decoration: none; color: var(--text);
    transition: transform .12s, box-shadow .12s;
    min-height: 50px;
  }
  .sec-card:active { transform: scale(0.97); }
  .sec-card:hover { box-shadow: var(--shadow); border-color: #d1d5db; }

  .sec-icon {
    width: 32px; height: 32px; border-radius: 9px;
    display: grid; place-items: center; font-size: 16px;
    flex-shrink: 0; line-height: 1;
  }
  .sec-info { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 1px; }
  .sec-name {
    font-size: 13.5px; font-weight: 700; color: var(--text);
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .sec-meta { font-size: 10.5px; color: var(--text-3); font-variant-numeric: tabular-nums; }
  .sec-pct {
    flex-shrink: 0; padding: 3px 8px; border-radius: 7px;
    font-size: 12.5px; font-weight: 800; font-variant-numeric: tabular-nums;
    line-height: 1.4; white-space: nowrap;
  }
  .sec-pct.up { background: var(--primary-soft); color: var(--up); }
  .sec-pct.down { background: #dcfce7; color: var(--down); }
  .sec-pct.flat { background: #f3f4f6; color: var(--text-2); }
  .sec-pct .arrow { font-size: 9px; margin-right: 1px; }

  /* Empty */
  .empty {
    text-align: center; padding: 50px 20px; color: var(--text-3);
    background: var(--card); border: 1px dashed var(--border); border-radius: var(--radius);
    margin-top: 14px;
  }
  .empty .em-icon { font-size: 36px; opacity: .5; }
  .empty p { margin-top: 10px; font-size: 13px; }

  /* Toast */
  .toast {
    position: fixed; left: 50%; bottom: 90px; transform: translateX(-50%) translateY(20px);
    background: #1f2937; color: #fff; padding: 10px 18px; border-radius: 10px; font-size: 13px;
    z-index: 60; opacity: 0; pointer-events: none; transition: .25s;
  }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

  /* Bottom navigation */
  .bottom-nav {
    box-sizing: border-box;
    position: fixed; bottom: 0; left: 0; right: 0; z-index: 100;
    height: calc(56px + env(safe-area-inset-bottom));
    padding-bottom: env(safe-area-inset-bottom);
    background: #fff; border-top: 1px solid var(--border);
    display: flex; justify-content: space-around; align-items: flex-start;
  }
  .bottom-nav a {
    flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center;
    height: 56px; gap: 3px; color: var(--text-3); text-decoration: none; font-size: 11px;
    -webkit-tap-highlight-color: transparent; transition: color .15s;
  }
  .bottom-nav a.active { color: var(--primary); font-weight: 600; }
  .bottom-nav svg {
    width: 22px; height: 22px; stroke: currentColor; stroke-width: 1.8; fill: none;
    stroke-linecap: round; stroke-linejoin: round; transition: stroke .15s;
  }
  .bottom-nav a .icon-fill { fill: currentColor; stroke: none; }
  @media (max-width: 360px) {
    .bottom-nav a { font-size: 10px; }
    .bottom-nav svg { width: 20px; height: 20px; }
  }

  .up { color: var(--up); } .down { color: var(--down); } .mono { font-variant-numeric: tabular-nums; }
</style>
</head>
<body>

<div class="topbar">
  <div class="topbar-inner">
    <div class="brand">
      <div class="brand-icon">富</div>
      <span>慢慢变富</span>
    </div>
    <div class="topbar-actions">
      <button class="link-like" id="btnRefresh">🔄 刷新</button>
    </div>

</div>

<div class="subbar">
  <div class="subbar-inner">
    <div class="market-status">
      <span class="market-dot" id="marketDot"></span>
      <span id="marketText">—</span>
    </div>
    <div class="refresh-set">
      <span>自动刷新</span>
      <div class="refresh-chips" id="refreshChips">
        <button data-ms="20000">20秒</button>

</div>

<div class="wrap">

  <!-- 顶部指数栏 -->
  <div class="indices-bar" data-indices-bar></div>

  <!-- 板块头部 -->
  <div class="sec-header">
    <span class="sec-header-title">板块数据</span>
    <span class="sec-tag live" id="secTag">交易中</span>
    <span class="sec-count" id="secCount">共 <b id="secTotal">—</b> 个板块</span>

  <!-- 涨跌汇总 -->
  <div class="sec-summary">
    <div class="sec-sum-item"><div class="v up" id="secUp">—</div><div class="l">上涨板块</div></div>
    <div class="sec-sum-item"><div class="v down" id="secDown">—</div><div class="l">下跌板块</div></div>

  <!-- 过滤 -->
  <div class="cat-pills" id="secFilter">

    <button class="pill" data-f="industry">行业板块</button>

    <button class="pill" data-f="down">领跌</button>

  <!-- 列表 -->
  <div class="sec-grid" id="secGrid"></div>
  <div class="empty" id="secEmpty" style="display:none">
    <div class="em-icon">⏳</div>
    <p id="secEmptyText">板块数据加载中…</p>
  </div>
</div>

<div class="toast" id="toast"></div>

<script src="indices.js"></script>
<script>
(function () {
  "use strict";
  var $ = function(s,r){return (r||document).querySelector(s);};
  var $$ = function(s,r){return Array.prototype.slice.call((r||document).querySelectorAll(s));};

  /* ============ 板块图标 emoji 映射（覆盖截图里出现的常用板块） ============ */
  var SECTOR_ICON = {
    "AI算力":"🤖","CPO":"🔌","半导体":"🔬","存储":"💾","数据中心":"🖥️","云计算":"☁️",
    "商业航天":"🚀","卫星":"🛰️","机器人":"🦾","自动驾驶":"🚗","核电":"⚛️","电网":"⚡",
    "军工":"🛡️","新能源":"⚡","光伏":"☀️","锂电池":"🔋","石油":"🛢️","天然气":"🔥",
    "铜/有色":"🟤","黄金":"🥇","银行":"🏦","银行金融":"🏦","金融":"🏦","生物医药":"🧬",
    "消费":"🛒","稀土永磁":"🧲","创新药":"💊","量子计算":"🔮","固态电池":"🔋","消费电子":"📱",
    "低空经济":"✈️","医疗器械":"🩺","新能源车":"🚗","储能":"🔋","保险":"🛡️","券商":"📈",
    "钢铁":"⚙️","化工":"🧪","建材":"🧱","传媒":"📰","地产":"🏘️","煤炭":"⛏️",
    "白酒":"🍶","食品":"🍱","家电":"📺","汽车":"🚗","通信":"📡","电子":"💻",
    "机械":"⚙️","纺织":"🧵","农业":"🌾","养殖":"🐔"
  };
  var SECTOR_COLORS = [
    "#ef4444","#f59e0b","#10b981","#3b82f6","#8b5cf6","#ec4899",
    "#06b6d4","#84cc16","#f97316","#a855f7","#14b8a6","#eab308"
  ];
  function pickColor(name) {
    var h = 0; for (var i = 0; i < name.length; i++) h = (h * 31 + name.charCodeAt(i)) >>> 0;
    return SECTOR_COLORS[h % SECTOR_COLORS.length];
  }
  function getIconEmoji(name) {
    if (SECTOR_ICON[name]) return SECTOR_ICON[name];
    // 模糊匹配关键词
    for (var k in SECTOR_ICON) {
      if (name.indexOf(k) >= 0) return SECTOR_ICON[k];
    }
    return null;
  }

  /* ============ 行情时段（北京时间 UTC+8） ============ */
  function zoneParts(now) {
    now = now || new Date();
    var p = {};
    new Intl.DateTimeFormat("en-GB", {
      timeZone: "Asia/Shanghai", hour12: false, weekday: "short",
      hour: "2-digit", minute: "2-digit", second: "2-digit"
    }).formatToParts(now).forEach(function (x) { p[x.type] = x.value; });
    return { wd: p.weekday, h: (+p.hour) % 24, mi: +p.minute, s: +p.second };
  }
  function marketSession() {
    var p = zoneParts();
    if (p.wd === "Sat" || p.wd === "Sun") return { open: false, name: "周末休市" };
    var t = p.h * 60 + p.mi;
    if (t < 9 * 60 + 15) return { open: false, name: "盘前" };
    if (t >= 9 * 60 + 15 && t < 9 * 60 + 30) return { open: true, name: "集合竞价" };
    if (t >= 9 * 60 + 30 && t <= 11 * 60 + 30) return { open: true, name: "交易中" };
    if (t > 11 * 60 + 30 && t < 13 * 60) return { open: false, name: "午休" };
    if (t >= 13 * 60 && t <= 15 * 60) return { open: true, name: "交易中" };
    return { open: false, name: "已收盘" };
  }
  function clockText() {
    var p = zoneParts();
    function pad(n){ return (n < 10 ? "0" : "") + n; }
    return pad(p.h) + ":" + pad(p.mi) + ":" + pad(p.s);
  }

  /* ============ 数据源：东方财富（push2，源数据，无 CORS 问题） ============ */
  function fetchEM(fs, fields) {
    // push2 主域在国内某些网络环境下不可达，使用 push2delay 备用域（数据相同）。
    var url = "https://push2delay.eastmoney.com/api/qt/clist/get?fid=f3&po=1&pz=300&pn=1&np=1&fltt=2&invt=2&fs=" + encodeURIComponent(fs) + "&fields=" + fields + "&_=" + Date.now();
    return fetch(url, { cache: "no-store" })
      .then(function (r) { return r.json(); })
      .catch(function () { return null; });
  }
  var SECTOR_FIELDS = "f1,f2,f3,f4,f12,f14";
  var allItems = [];   // 全部板块
  var filter = "all";

  function refresh() {
    $("#secEmpty").style.display = "block";
    $("#secEmptyText").textContent = "板块数据加载中…";
    $("#secGrid").innerHTML = "";

    var tasks = [
      fetchEM("m:90+t:3", SECTOR_FIELDS), // 概念
      fetchEM("m:90+t:2", SECTOR_FIELDS)  // 申万行业
    ];
    Promise.all(tasks).then(function (res) {
      var merged = [];
      var seen = Object.create(null);
      function pushList(arr, type) {
        if (!arr || !Array.isArray(arr)) return;
        // 同主题去重：忽略 Ⅰ/Ⅱ/Ⅲ/Ⅳ 这种版本后缀（B1249/B1492 同主题双胞胎等情况）
        function normName(n) {
          return String(n || "").replace(/[ⅠⅡⅢⅣⅤⅥⅦⅧⅨⅩⅪⅫ]+\s*$/, "").trim();
        }
        for (var i = 0; i < arr.length; i++) {
          var r = arr[i];
          if (!r) continue;
          var name = r.f14;
          var code = r.f12;
          var pct = r.f3;
          var abs = r.f4;
          var idxVal = r.f2;
          if (!name || !code || pct == null) continue;
          var key = normName(name);
          if (seen[key]) continue;       // 同主题去重（去版本后缀）
          seen[key] = true;
          merged.push({
            name: name, code: code, pct: pct,
            abs: abs == null ? 0 : abs,
            idx: idxVal || 0, type: type
          });
        }
      }
      pushList(res[0] && res[0].data && res[0].data.diff, "concept");
      pushList(res[1] && res[1].data && res[1].data.diff, "industry");

      allItems = merged;

      // 涨跌统计
      var upCount = 0, downCount = 0, flatCount = 0;
      for (var i = 0; i < allItems.length; i++) {
        if (allItems[i].pct > 0) upCount++;
        else if (allItems[i].pct < 0) downCount++;
        else flatCount++;
      }
      $("#secUp").textContent = upCount;
      $("#secDown").textContent = downCount;
      $("#secFlat").textContent = flatCount;
      $("#secTotal").textContent = allItems.length;

      render();
      $("#secEmpty").style.display = allItems.length ? "none" : "block";
      $("#secEmptyText").textContent = "暂无板块数据，请稍后刷新";
    }).catch(function (e) {
      console.error("[sectors] fetch failed", e);
      $("#secEmpty").style.display = "block";
      $("#secEmptyText").textContent = "数据加载失败，请点击右上角 🔄 刷新";
    });
  }

  function render() {
    var list = allItems.slice();
    if (filter === "concept") {
      list = list.filter(function (s) { return s.type === "concept"; });
    } else if (filter === "industry") {
      list = list.filter(function (s) { return s.type === "industry"; });
    } else if (filter === "up") {
      list = list.filter(function (s) { return s.pct > 0; }).sort(function (a, b) { return b.pct - a.pct; });
    } else if (filter === "down") {
      list = list.filter(function (s) { return s.pct < 0; }).sort(function (a, b) { return a.pct - b.pct; });
    } else {
      // 默认：按"绝对涨跌幅"降序（最活跃靠前）
      list.sort(function (a, b) { return Math.abs(b.pct) - Math.abs(a.pct); });
    }
    list = list.slice(0, 200);

    var grid = $("#secGrid");
    if (!list.length) {
      grid.innerHTML = "";
      $("#secEmpty").style.display = "block";
      $("#secEmptyText").textContent = "当前筛选下无板块数据";
      return;
    }
    $("#secEmpty").style.display = "none";

    grid.innerHTML = list.map(function (s) {
      var emoji = getIconEmoji(s.name);
      var color = pickColor(s.name);
      var iconHtml = emoji
        ? '<div class="sec-icon" style="background:' + color + '1f;color:' + color + '">' + emoji + '</div>'
        : '<div class="sec-icon" style="background:' + color + '1f;color:' + color + ';font-weight:800;font-size:14px">' + s.name.charAt(0) + '</div>';

      var cls = s.pct > 0 ? "up" : (s.pct < 0 ? "down" : "flat");
      var arrow = s.pct > 0 ? "▲" : (s.pct < 0 ? "▼" : "—");
      var sign = s.pct > 0 ? "+" : "";
      var pctStr = sign + s.pct.toFixed(2) + "%";

      var idxStr = (s.idx != null && !isNaN(s.idx)) ? s.idx.toFixed(2) : "—";
      var meta = s.type === "concept" ? "概念" : "行业";

      return '<div class="sec-card" data-code="' + s.code + '" title="' + s.name + ' ' + pctStr + '">' +
        iconHtml +
        '<div class="sec-info">' +
          '<div class="sec-name">' + s.name + '</div>' +
          '<div class="sec-meta">' + meta + ' · ' + idxStr + '</div>' +
        '</div>' +
        '<div class="sec-pct ' + cls + '"><span class="arrow">' + arrow + '</span>' + pctStr + '</div>' +
      '</div>';
    }).join('');
  }

  /* ============ 时段显示 + 自动刷新 ============ */
  function updateMarket() {
    var s = marketSession();
    var dot = $("#marketDot");
    var txt = $("#marketText");
    var tag = $("#secTag");
    dot.className = "market-dot" + (s.open ? " open" : "");
    txt.textContent = s.name + " · " + clockText();
    tag.textContent = s.open ? "A 股" : s.name;
    tag.className = "sec-tag " + (s.open ? "live" : "idle");
  }
  var timer = null;
  function schedule() {
    if (timer) clearTimeout(timer);
    var s = marketSession();
    // 交易中 20 秒，非交易中 60 秒
    var delay = s.open ? 20000 : 60000;
    timer = setTimeout(function () { refresh().then(schedule, schedule); }, delay);
  }

  /* ============ 过滤 Tab + 刷新按钮 + 频率切换 ============ */
  function bindFilter() {
    $$("#secFilter .pill").forEach(function (btn) {
      btn.addEventListener("click", function () {
        $$("#secFilter .pill").forEach(function (b) { b.classList.remove("active"); });
        btn.classList.add("active");
        filter = btn.dataset.f;
        render();
      });
    });
    $("#btnRefresh").addEventListener("click", function () {
      refresh();
      flashToast("已刷新");
    });
    $$("#refreshCips button, #refreshChips button").forEach(function () {}); // no-op
    $$("#refreshChips button").forEach(function (btn) {
      btn.addEventListener("click", function () {
        $$("#refreshChips button").forEach(function (b) { b.classList.remove("active"); });
        btn.classList.add("active");
        AUTO_MS = parseInt(btn.dataset.ms, 10) || 60000;
        schedule();
        flashToast("已切换自动刷新频率");
      });
    });
    document.addEventListener("visibilitychange", function () {
      if (document.hidden) return;
      updateMarket();
      refresh();
    });
  }

  var AUTO_MS = 60000;
  $$("#refreshChips button").forEach(function (btn) {
    if (btn.classList.contains("active")) AUTO_MS = parseInt(btn.dataset.ms, 10) || 60000;
  });

  /* ============ Toast ============ */
  function flashToast(msg) {
    var t = $("#toast");
    t.textContent = msg;
    t.classList.add("show");
    setTimeout(function () { t.classList.remove("show"); }, 1600);
  }

  /* ============ Init ============ */
  function init() {
    bindFilter();
    updateMarket();
    setInterval(updateMarket, 1000);
    refresh().then(function () { schedule(); }, function () { schedule(); });
  }
  if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", init);
  else init();
})();
</script>
</body>
