<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
<meta http-equiv="Pragma" content="no-cache" />
<meta http-equiv="Expires" content="0" />
<title>慢慢变富 · 股票记账</title>
<style>
  :root {
    --primary: #E03025;
    --primary-soft: #fff0f0;
    --up: #E03025;
    --down: #16a34a;
    --bg: #f3f4f6;
    --card: #ffffff;
    --border: #e5e7eb;
    --text: #1f2937;
    --text-2: #6b7280;
    --text-3: #9ca3af;
    --blue-tag: #eff6ff; --blue-text: #2563eb;
    --gray-tag: #f3f4f6; --gray-text: #6b7280;
    --radius: 12px;
    --radius-lg: 16px;
    --shadow: 0 1px 2px rgba(0,0,0,.04), 0 1px 3px rgba(0,0,0,.06);
    --font: -apple-system, BlinkMacSystemFont, "PingFang SC", "Helvetica Neue", sans-serif;
    --sync-on: #16a34a; --sync-busy: #f59e0b; --sync-fail: #dc2626;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    font-family: var(--font); background: var(--bg); color: var(--text);
    font-size: 14px; line-height: 1.5; -webkit-font-smoothing: antialiased;
    padding-bottom: 120px;
    padding-bottom: calc(120px + env(safe-area-inset-bottom));
  }
  .wrap { max-width: 960px; margin: 0 auto; padding: 0 16px 40px; padding: 0 16px calc(40px + env(safe-area-inset-bottom)); }

  /* ---- Top bar ---- */
  .topbar {
    position: sticky; top: 0; z-index: 30;
    background: rgba(255,255,255,.9); backdrop-filter: saturate(180%) blur(10px);
    border-bottom: 1px solid var(--border);
  }
  .topbar-inner {
    max-width: 960px; margin: 0 auto; padding: 12px 16px;
    display: flex; align-items: center; gap: 12px;
  }
  .brand { display: flex; align-items: center; gap: 8px; font-weight: 700; font-size: 16px; }
  .brand-icon {
    width: 30px; height: 30px; border-radius: 8px;
    background: linear-gradient(135deg, #E03025, #f0654f); color: #fff;
    display: grid; place-items: center; font-size: 15px; box-shadow: var(--shadow);
  }
  .topbar-actions { margin-left: auto; display: flex; align-items: center; gap: 8px; }
  .sync-dot { display: inline-block; width: 7px; height: 7px; border-radius: 50%; background: var(--text-3); margin-left: 4px; vertical-align: middle; }
  .sync-dot.on { background: var(--sync-on); }
  .sync-dot.busy { background: var(--sync-busy); }
  .sync-dot.fail { background: var(--sync-fail); }
  .link-like {
    font-family: var(--font); font-size: 13px; color: var(--text-2);
    background: transparent; border: none; cursor: pointer; padding: 6px 8px; border-radius: 8px;
  }
  .link-like:hover { background: #f3f4f6; color: var(--text); }
  .link-like.active { color: var(--primary); background: var(--primary-soft); font-weight: 600; }
  .link-like:disabled, .link-like.disabled { color: var(--text-3); opacity: .6; cursor: not-allowed; }
  .link-like:disabled:hover { background: none; color: var(--text-3); }

  /* ---- Sub bar (market status & auto refresh) ---- */
  .subbar { background: #fff; border-bottom: 1px solid var(--border); }
  .subbar-inner {
    max-width: 960px; margin: 0 auto; padding: 8px 16px;
    display: flex; align-items: center; justify-content: space-between; gap: 12px;
  }
  .market-status { display: flex; align-items: center; gap: 6px; font-size: 13px; color: var(--text-2); }
  .market-dot { width: 8px; height: 8px; border-radius: 50%; background: #d1d5db; flex-shrink: 0; }
  .market-dot.open { background: var(--down); box-shadow: 0 0 0 2px rgba(22,163,74,.15); }
  .refresh-set { display: flex; align-items: center; gap: 8px; font-size: 13px; color: var(--text-2); }
  .refresh-chips { display: flex; gap: 4px; }
  .refresh-chips button {
    font-family: var(--font); font-size: 12px; font-weight: 600; color: var(--text-2);
    padding: 4px 10px; border: 1px solid var(--border); border-radius: 999px; background: #fff; cursor: pointer; transition: .15s;
  }
  .refresh-chips button:hover { border-color: var(--text-2); }
  .refresh-chips button.active { background: var(--primary); color: #fff; border-color: var(--primary); }

  /* ---- Sub header ---- */
  .sub-header { text-align: center; padding: 18px 0 6px; }
  .sub-header h1 { font-size: 20px; font-weight: 800; letter-spacing: 1px; }
  .sort-tabs {
    display: inline-flex; align-items: center; gap: 6px;
    background: #fff; border: 1px solid var(--border); border-radius: 999px;
    padding: 4px; margin-top: 12px;
  }
  .sort-tab {
    font-family: var(--font); font-size: 13px; font-weight: 600; color: var(--text-2);
    padding: 6px 14px; border-radius: 999px; border: none; background: transparent;
    cursor: pointer; transition: .15s;
  }
  .sort-tab.active { background: var(--primary); color: #fff; }
  .add-stock-btn {
    margin-top: 12px; font-family: var(--font); font-size: 13px; font-weight: 600;
    color: var(--primary); background: #fff; border: 1px solid var(--primary);
    padding: 7px 16px; border-radius: 999px; cursor: pointer; transition: .15s;
  }
  .add-stock-btn:hover { background: var(--primary-soft); }

  /* ---- Summary ---- */
  .summary-row { display: flex; gap: 12px; margin-top: 14px; }
  .summary-card {
    flex: 1; background: var(--card); border: 1px solid var(--border);
    border-radius: var(--radius); padding: 18px 12px; box-shadow: var(--shadow);
    text-align: center;
  }
  .summary-card .label { font-size: 12px; color: var(--text-2); }
  .summary-card .value { font-size: 26px; font-weight: 800; color: var(--primary); margin-top: 6px; font-variant-numeric: tabular-nums; }

  /* ---- Category pills ---- */
  .cat-pills { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 16px; }
  .pill {
    font-family: var(--font); font-size: 13px; font-weight: 600; color: var(--text-2);
    padding: 6px 14px; border-radius: 999px; border: 1px solid var(--border);
    background: #fff; cursor: pointer; transition: .15s;
  }
  .pill.active { background: var(--primary); color: #fff; border-color: var(--primary); }

  /* ---- Card grid ---- */
  .card-grid {
    display: grid; grid-template-columns: repeat(auto-fill, minmax(340px, 1fr)); gap: 12px;
    margin-top: 14px;
  }
  @media (max-width: 720px) {
    .card-grid { grid-template-columns: 1fr; }
    .summary-row { flex-direction: column; }
  }

  /* ---- Stock card ---- */
  .stock-card {
    background: var(--card); border: 1px solid var(--border); border-radius: var(--radius);
    padding: 14px; box-shadow: var(--shadow);
  }
  .card-top { display: flex; justify-content: space-between; align-items: flex-start; }
  .stock-name { font-size: 16px; font-weight: 800; display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
  .code { font-size: 12px; color: var(--text-3); font-weight: 500; font-variant-numeric: tabular-nums; }
  .tag {
    display: inline-block; font-size: 11px; font-weight: 700; padding: 2px 8px; border-radius: 6px;
  }
  .tag-blue { background: var(--blue-tag); color: var(--blue-text); }
  .tag-red { background: var(--primary-soft); color: var(--primary); }
  .tag-gray { background: var(--gray-tag); color: var(--gray-text); }
  .stock-price { text-align: right; }
  .price-now { font-size: 18px; font-weight: 800; font-variant-numeric: tabular-nums; }
  .price-chg { font-size: 12px; font-variant-numeric: tabular-nums; }
  .dividend-hint { font-size: 12px; color: var(--text-3); margin-top: 6px; }

  .card-row {
    display: flex; justify-content: space-between; align-items: center;
    margin-top: 10px; min-height: 22px;
  }
  .yield-left { display: flex; align-items: center; gap: 6px; }
  .cost-yield { font-size: 12px; color: var(--text-2); }
  .yield-note { font-size: 11px; color: var(--text-3); margin: -4px 0 8px; padding: 0 2px; font-variant-numeric: tabular-nums; }
  .cost-note { font-size: 11px; color: var(--text-3); margin: -2px 0 8px; padding: 0 2px; font-variant-numeric: tabular-nums; }

  .input-row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 10px; }
  .field-compact {
    background: #f9fafb; border: 1px solid var(--border); border-radius: 8px; padding: 8px 10px;
  }
  .field-compact label { display: block; font-size: 11px; color: var(--text-3); margin-bottom: 2px; }
  .field-compact input {
    width: 100%; font-family: var(--font); font-size: 15px; font-weight: 700; color: var(--text);
    border: none; background: transparent; outline: none; font-variant-numeric: tabular-nums;
  }

  .summary-pink {
    background: var(--primary-soft); border-radius: 10px; padding: 12px 8px;
    display: flex; justify-content: space-around; margin-top: 10px;
  }
  .sum-item { text-align: center; }
  .sum-label { font-size: 11px; color: #b45353; }
  .sum-value { font-size: 14px; font-weight: 800; margin-top: 2px; font-variant-numeric: tabular-nums; }

  .metrics-row {
    display: flex; justify-content: space-between; margin-top: 10px;
    font-size: 12px; color: var(--text-2);
  }
  .card-footer {
    display: flex; border-top: 1px solid #f3f4f6; margin-top: 12px; padding-top: 10px;
  }
  .card-footer button {
    flex: 1; font-family: var(--font); font-size: 13px; font-weight: 600; color: var(--text-2);
    background: transparent; border: none; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 4px;
  }
  .card-footer button:hover { color: var(--text); }
  .card-footer button.danger { color: var(--primary); }
  .card-footer button.danger:hover { color: #b91c1c; }

  /* ---- Empty ---- */
  .empty {
    text-align: center; padding: 50px 20px; color: var(--text-3);
    background: var(--card); border: 1px dashed var(--border); border-radius: var(--radius);
  }
  .empty .em-icon { font-size: 36px; opacity: .5; }
  .empty p { margin-top: 10px; font-size: 13px; }

  /* ---- Table view ---- */
  .table-card {
    background: var(--card); border: 1px solid var(--border); border-radius: var(--radius);
    box-shadow: var(--shadow); overflow: hidden; margin-top: 14px;
  }
  table { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; }
  thead th {
    font-size: 12px; font-weight: 600; color: var(--text-3); text-align: right;
    padding: 10px 10px; background: #fafafa; border-bottom: 1px solid var(--border); white-space: nowrap;
  }
  thead th:first-child, tbody td:first-child { text-align: left; }
  tbody td { padding: 11px 10px; font-size: 13px; text-align: right; border-bottom: 1px solid #f1f2f4; white-space: nowrap; }
  tbody tr:last-child td { border-bottom: none; }
  tbody tr:hover { background: #fafbfc; }
  .td-name { font-weight: 700; }
  .td-sub { font-size: 11px; color: var(--text-3); }
  .tag-buy, .tag-sell {
    display: inline-block; font-size: 11px; font-weight: 700; padding: 2px 8px; border-radius: 6px;
  }
  .tag-buy { background: var(--primary-soft); color: var(--primary); }
  .tag-sell { background: #dcfce7; color: var(--down); }

  /* ---- 单只股票交易历史 ---- */
  .hist-row {
    display: flex; align-items: center; gap: 10px; padding: 12px 0;
    border-bottom: 1px solid var(--border);
  }
  .hist-row:last-child { border-bottom: none; }
  .hist-left { flex: 1; min-width: 0; }
  .hist-date { font-size: 12px; color: var(--text-3); margin-left: 6px; font-variant-numeric: tabular-nums; }
  .hist-sub { font-size: 13px; color: var(--text-2); margin-top: 4px; font-variant-numeric: tabular-nums; }
  .hist-note { font-size: 12px; color: var(--text-3); margin-top: 3px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .hist-right { text-align: right; flex-shrink: 0; }
  .hist-amount { font-size: 15px; font-weight: 800; font-variant-numeric: tabular-nums; color: var(--text); margin-bottom: 4px; }

  /* ---- Modal ---- */
  .mask {
    position: fixed; inset: 0; background: rgba(17,24,39,.45); z-index: 50;
    display: none; align-items: flex-end; justify-content: center;
  }
  .mask.open { display: flex; }
  .sheet {
    background: #fff; width: 100%; max-width: 720px; border-radius: 16px 16px 0 0;
    padding: 18px 16px calc(18px + env(safe-area-inset-bottom)); animation: rise .22s ease;
    max-height: 92vh; overflow-y: auto;
  }
  @media (min-width: 600px) {
    .mask { align-items: center; }
    .sheet { border-radius: 16px; margin: 16px; }
  }
  @keyframes rise { from { transform: translateY(20px); opacity: .6; } to { transform: translateY(0); opacity: 1; } }
  .sheet-head { display: flex; align-items: center; margin-bottom: 14px; }
  .sheet-head h3 { font-size: 16px; font-weight: 700; }
  .sheet-head .close { margin-left: auto; }

  .field { margin-bottom: 12px; }
  .field label { display: block; font-size: 13px; color: var(--text-2); margin-bottom: 5px; font-weight: 500; }
  .field input, .field select {
    width: 100%; font-family: var(--font); font-size: 15px; color: var(--text);
    padding: 10px 12px; border: 1px solid var(--border); border-radius: 10px; background: #fff;
    outline: none; transition: .15s;
  }
  .field input:focus, .field select:focus { border-color: var(--primary); box-shadow: 0 0 0 3px var(--primary-soft); }
  .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .grid-3 { display: grid; grid-template-columns: repeat(3,1fr); gap: 12px; }
  .seg { display: flex; gap: 8px; }
  .seg button {
    flex: 1; padding: 11px; border: 1px solid var(--border); border-radius: 10px; background: #fff;
    font-family: var(--font); font-size: 14px; font-weight: 600; color: var(--text-2); cursor: pointer;
  }
  .seg button.on-buy { background: var(--primary-soft); border-color: var(--primary); color: var(--primary); }
  .seg button.on-sell { background: #dcfce7; border-color: var(--down); color: var(--down); }
  .sheet-foot { display: flex; gap: 10px; margin-top: 6px; }
  .sheet-foot .btn { flex: 1; justify-content: center; padding: 12px; font-size: 15px; }

  .hint { font-size: 12px; color: var(--text-3); margin-top: 4px; }
  .sheet-divider { font-size: 12px; color: var(--text-3); margin: 8px 0 12px; border-bottom: 1px solid var(--border); padding-bottom: 6px; }

  /* ---- Add-stock modal (screenshot style) ---- */
  .field-label-wrap { display: flex; align-items: center; gap: 6px; margin-bottom: 5px; }
  .field-label-wrap label { margin-bottom: 0; }
  .label-badge {
    display: inline-flex; align-items: center; gap: 3px;
    font-size: 11px; font-weight: 600; color: #E03025; background: #fff0f0;
    padding: 1px 6px; border-radius: 999px;
  }
  .label-badge::before { content: "✓"; font-size: 10px; }
  .checkbox-list { display: flex; flex-direction: column; gap: 10px; margin-top: 4px; }
  .chk-row {
    display: flex; align-items: center; gap: 8px;
    font-size: 14px; color: var(--text); cursor: pointer;
  }
  .chk-row input[type="checkbox"] {
    width: 18px; height: 18px; accent-color: var(--primary); cursor: pointer; flex-shrink: 0;
  }
  .chk-row .chk-hint { font-size: 12px; color: var(--text-2); margin-left: 2px; }
  .btn-submit {
    width: 100%; margin-top: 16px;
    font-family: var(--font); font-size: 15px; font-weight: 700; color: #fff;
    background: var(--primary); border: none; border-radius: 10px;
    padding: 13px; cursor: pointer; transition: .15s;
  }
  .btn-submit:hover { background: #c4281e; }

  /* ---- Toast ---- */
  .toast {
    position: fixed; left: 50%; bottom: 80px; transform: translateX(-50%) translateY(20px);
    background: #1f2937; color: #fff; padding: 10px 18px; border-radius: 10px; font-size: 13px;
    z-index: 60; opacity: 0; pointer-events: none; transition: .25s;
  }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

  .up { color: var(--up); }
  .down { color: var(--down); }
  .mono { font-variant-numeric: tabular-nums; }

  /* ---- Stock search (add by name/code) ---- */
  .search-wrap { position: relative; }
  .search-drop {
    position: absolute; left: 0; right: 0; top: 100%; z-index: 20;
    background: #fff; border: 1px solid var(--border); border-radius: 10px;
    margin-top: 5px; max-height: 268px; overflow-y: auto; box-shadow: 0 10px 28px rgba(0,0,0,.14);
    display: none;
  }
  .search-drop.open { display: block; }
  .search-item { padding: 10px 12px; cursor: pointer; display: flex; align-items: center; gap: 8px; border-bottom: 1px solid #f3f4f6; }
  .search-item:last-child { border-bottom: none; }
  .search-item:hover, .search-item.active { background: var(--primary-soft); }
  .search-name { font-weight: 700; }
  .search-code { font-size: 12px; color: var(--text-3); font-variant-numeric: tabular-nums; }
  .search-sec { margin-left: auto; font-size: 12px; color: var(--text-2); white-space: nowrap; }
  .search-empty { padding: 12px; color: var(--text-3); font-size: 13px; }

  .view { display: none; }
  .view.active { display: block; }

  .fab {
    position: fixed; right: 18px; bottom: calc(62px + env(safe-area-inset-bottom)); z-index: 25;
    width: 50px; height: 50px; border-radius: 50%; border: none;
    background: var(--primary); color: #fff; font-size: 24px; font-weight: 700;
    box-shadow: 0 4px 12px rgba(224,48,37,.35); cursor: pointer; display: grid; place-items: center;
  }
  .fab:hover { background: #c4281e; }

  /* ---- Bottom navigation ---- */
  .bottom-nav {
    box-sizing: border-box;
    position: fixed; bottom: 0; left: 0; right: 0; z-index: 100;
    height: calc(56px + env(safe-area-inset-bottom));
    padding-bottom: env(safe-area-inset-bottom);
    background: #fff; border-top: 1px solid var(--border);
    display: flex; justify-content: space-around; align-items: flex-start;
  }
  .bottom-nav a {
    flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center;
    height: 56px; gap: 3px; color: var(--text-3); text-decoration: none; font-size: 11px;
    -webkit-tap-highlight-color: transparent; transition: color .15s;
  }
  .bottom-nav a.active { color: var(--primary); font-weight: 600; }
  .bottom-nav svg {
    width: 22px; height: 22px; stroke: currentColor; stroke-width: 1.8; fill: none;
    stroke-linecap: round; stroke-linejoin: round; transition: stroke .15s;
  }
  .bottom-nav a .icon-fill { fill: currentColor; stroke: none; }
  @media (max-width: 360px) {
    .bottom-nav a { font-size: 10px; }
    .bottom-nav svg { width: 20px; height: 20px; }
  }

  /* ===== 顶部指数栏（响应式：每个指数内部名称/数值/百分比始终一行） ===== */
  .indices-bar {
    display: flex; align-items: center; gap: 0; flex-wrap: wrap;
    margin: 0 0 10px; padding: 8px 10px;
    background: var(--card, #fff); border: 1px solid var(--border, #e5e7eb);
    border-radius: var(--radius, 12px); box-shadow: var(--shadow, none);
    font-size: 12px;
  }
  .indices-bar .idx-item {
    flex: 1 1 100%; min-width: 0; display: flex; flex-direction: row;
    align-items: baseline; gap: 4px; white-space: nowrap;
    padding: 5px 0; border-bottom: 1px solid var(--border, #e5e7eb);
  }
  .indices-bar .idx-item:last-of-type { border-bottom: none; }
  .indices-bar .idx-name { font-size: 11px; color: var(--text-2, #6b7280); flex: 0 0 auto; }
  .indices-bar .idx-val {
    font-size: 14px; font-weight: 700; color: var(--text, #1f2937);
    font-variant-numeric: tabular-nums; line-height: 1.1;
  }
  .indices-bar .idx-chg {
    font-size: 11px; font-weight: 600; font-variant-numeric: tabular-nums;
    flex: 0 0 auto;
  }
  .indices-bar .idx-chg.up { color: #E03025; }
  .indices-bar .idx-chg.down { color: #16a34a; }
  .indices-bar .idx-chg.flat { color: #9ca3af; }
  .indices-bar .idx-abs {
    font-size: 11px; font-weight: 600; font-variant-numeric: tabular-nums;
    flex: 0 0 auto; margin-left: 2px;
  }
  .indices-bar .idx-abs.up { color: #E03025; }
  .indices-bar .idx-abs.down { color: #16a34a; }
  .indices-bar .idx-abs.flat { color: #9ca3af; }
  .indices-bar .idx-time {
    flex: 0 0 100%; margin-top: 2px; padding-top: 4px;
    font-size: 10px; color: #9ca3af; font-variant-numeric: tabular-nums;
    white-space: nowrap; text-align: right;
    border-top: 1px solid var(--border, #e5e7eb);
  }
  @media (min-width: 560px) {
    .indices-bar { flex-wrap: nowrap; padding: 8px 12px; }
    .indices-bar .idx-item {
      flex: 1 1 0; padding: 0 10px; border-bottom: none;
      border-right: 1px solid var(--border, #e5e7eb);
    }
    .indices-bar .idx-item:last-of-type { border-right: none; }
    .indices-bar .idx-name { font-size: 12px; }
    .indices-bar .idx-val { font-size: 15px; }
    .indices-bar .idx-chg { font-size: 12px; }
    .indices-bar .idx-abs { font-size: 12px; }
    .indices-bar .idx-time {
      flex: 0 0 auto; margin-left: auto; margin-top: 0; padding-top: 0; padding-left: 12px;
      text-align: right; border-top: none; border-left: 1px solid var(--border, #e5e7eb);
    }
  }
</style>
</head>
<body>

<div class="topbar">
  <div class="topbar-inner">
    <div class="brand">
      <div class="brand-icon">富</div>
      <span>慢慢变富</span>
    </div>
    <div class="topbar-actions">

    state.trades.forEach(t => t.updatedAt = now);
    if (!Array.isArray(state.deleted)) state.deleted = [];
    localStorage.setItem(KEY, JSON.stringify(state));
    if (sync.enabled && !suppressPush) pushSync();
  }

  // ---------- Trade engine ----------
  function compute() {
    const map = {};
    const tradePnl = {};
    const ordered = state.trades.slice().sort((a,b)=> (a.date<b.date?-1:a.date>b.date?1:0));
    for (const t of ordered) {
      const c = t.code;
      if (!map[c]) map[c] = { qty: 0, avgCost: 0, name: t.name };
      const h = map[c]; const amount = t.price * t.qty;
      if (t.type === "buy") {
        const total = amount + (t.fee||0); const nq = h.qty + t.qty;
        h.avgCost = nq > 0 ? (h.qty * h.avgCost + total) / nq : 0; h.qty = nq;
        tradePnl[t.id] = 0;
      } else {
        const proceeds = amount - (t.fee||0); const cb = h.avgCost * t.qty;
        tradePnl[t.id] = proceeds - cb; h.qty = Math.max(0, h.qty - t.qty);
        if (h.qty === 0) h.avgCost = 0;
      }
    }
    return { map, tradePnl };
  }
  // 该股若「从未记录交易」但手动设置了持仓基线，首次记交易前补一条「期初持仓」买入记录，
  // 让交易记录成为持仓的唯一来源，卡片/历史/盈亏保持一致
  function ensureBaseline(code) {
    const s = state.stocks.find(x => (x.code || "") === code);
    if (!s) return;
    const hasTrades = state.trades.some(t => (t.code || "") === code);
    if (hasTrades) return;
    if (s.shares == null || s.shares === "" || Number(s.shares) <= 0) return;
    const baseQty = Number(s.shares);
    const baseCost = Number(s.cost) || 0;
    state.trades.push({ id: uid(), code, name: s.name, type: "buy", baseline: true,
      date: "1900-01-01", price: baseCost, qty: baseQty, fee: 0, note: "期初持仓", updatedAt: Date.now() });
  }
  // 交易记录保存/删除后，把该股手动持仓字段同步为「全部记录」算出的持仓，保证卡片与记录一致
  function syncHolding(code) {
    const s = state.stocks.find(x => (x.code || "") === code);
    if (!s) return;
    const { map } = compute();
    const h = map[code];
    if (h && h.qty > 0) {
      s.shares = h.qty;
      s.cost = h.avgCost;
    } else {
      s.shares = 0;
      s.cost = 0;
    }
  }

  function fmt(n, d=2) {
    if (n === null || n === undefined || isNaN(n)) return "—";
    return Number(n).toLocaleString("zh-CN", { minimumFractionDigits: d, maximumFractionDigits: d });
  }
  // 是否为基金类（ETF/LOF/基金），其价格保留小数点后 3 位
  function isFundStock(s) {
    return !!(s && (s.fundType === "场内基金" || s.fundType === "场外基金" || /^(ETF|LOF|基金)$/.test(s.sector||"")));
  }
  function stockByCode(code) { return state.stocks.find(x => (x.code||"") === code); }
  function priceDecimals(code) { const s = stockByCode(code); return s && isFundStock(s) ? 3 : 2; }
  function sign(n) { return n > 0 ? "+" : ""; }
  function cls(n) { return n > 0 ? "up" : (n < 0 ? "down" : ""); }
  function uid() { return Date.now().toString(36) + Math.random().toString(36).slice(2,7); }
  function escapeHtml(s) {
    return String(s==null?"":s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  }

  // ---------- 多端实时同步 ----------
  const SYNC_KEY = "mmbf_sync_cfg_v1";
  const sync = { enabled: false, token: "", room: "", device: "", lastSeen: 0, timer: null };
  function loadSyncCfg() {
    try { const c = JSON.parse(localStorage.getItem(SYNC_KEY)); if (c) Object.assign(sync, c); } catch(e){}
  }
  function saveSyncCfg() {
    localStorage.setItem(SYNC_KEY, JSON.stringify({ enabled: sync.enabled, token: sync.token, room: sync.room, device: sync.device, lastSeen: sync.lastSeen }));
  }
  function setDot(cls, title) {
    const d = $("#syncDot");
    if (d) { d.className = "sync-dot" + (cls ? " " + cls : ""); d.title = title || ""; }
  }
  // 同步异常 -> 可读文案；失败时状态点用独立红色（.fail），与“进行中”（琥珀）区分
  function syncErrMsg(e) {
    if (e && e.status === 401) return "同步失败：GitHub 令牌无效或已过期";
    if (e && e.status === 403) return "同步失败：令牌缺少 gist 权限";
    if (e && e.status === 404) return "同步失败：同步码（Gist ID）不存在";
    if (e && e.status === "timeout") return "同步失败：请求超时，请检查网络";
    return "同步失败：GitHub 不可达或网络异常";
  }
  // 按 id 做「最后写入获胜」(LWW) 合并
  function mergeArr(a, b) {
    const m = new Map();
    (a||[]).forEach(r => m.set(r.id, r));
    (b||[]).forEach(r => {
      const cur = m.get(r.id);
      const rt = r.updatedAt || 0, ct = cur ? (cur.updatedAt || 0) : -1;
      if (!cur || rt > ct) m.set(r.id, r);
    });
    return Array.from(m.values());
  }
  function applyDeleted(s) {
    const del = new Set(s.deleted || []);
    s.stocks = (s.stocks || []).filter(x => !del.has(x.id));
    s.trades = (s.trades || []).filter(x => !del.has(x.id));
    return s;
  }
  // ---------- GitHub Gist 同步后端（免服务器，中国可访问） ----------
  function gistHeaders() {
    return {
      "Authorization": "Bearer " + sync.token,
      "Accept": "application/vnd.github+json",
      "Content-Type": "application/json",
      "X-GitHub-Api-Version": "2022-11-28"
    };
  }
  const GIST_FILE = "state.json";
  async function gistFetchState() {
    const ctrl = new AbortController();
    const to = setTimeout(() => ctrl.abort(), 12000);
    try {
      const res = await fetch("https://api.github.com/gists/" + encodeURIComponent(sync.room) + "?t=" + Date.now(), { headers: gistHeaders(), cache: "no-store", signal: ctrl.signal });
      if (res.status === 404) return null;
      if (!res.ok) { const err = new Error("http"); err.status = res.status; throw err; }
      const data = await res.json();
      const f = data.files && data.files[GIST_FILE];
      if (!f || f.content == null) return { stocks: [], trades: [], deleted: [] };
      try { return JSON.parse(f.content); } catch (e) { return { stocks: [], trades: [], deleted: [] }; }
    } catch (e) {
      if (e && e.name === "AbortError") { const err = new Error("timeout"); err.status = "timeout"; throw err; }
      throw e;
    } finally { clearTimeout(to); }
  }
  async function gistPushState() {
    const ctrl = new AbortController();
    const to = setTimeout(() => ctrl.abort(), 12000);
    try {
      const content = JSON.stringify({ stocks: state.stocks, trades: state.trades, deleted: state.deleted });
      const res = await fetch("https://api.github.com/gists/" + encodeURIComponent(sync.room), {
        method: "PATCH", headers: gistHeaders(),
        body: JSON.stringify({ files: { [GIST_FILE]: { content } } }),
        signal: ctrl.signal
      });
      if (!res.ok) { const err = new Error("http"); err.status = res.status; throw err; }
    } catch (e) {
      if (e && e.name === "AbortError") { const err = new Error("timeout"); err.status = "timeout"; throw err; }
      throw e;
    } finally { clearTimeout(to); }
  }
  async function gistCreate() {
    const ctrl = new AbortController();
    const to = setTimeout(() => ctrl.abort(), 12000);
    try {
      const content = JSON.stringify({ stocks: state.stocks, trades: state.trades, deleted: state.deleted });
      const res = await fetch("https://api.github.com/gists", {
        method: "POST", headers: gistHeaders(),
        body: JSON.stringify({ description: "stock-ledger-sync", public: false, files: { [GIST_FILE]: { content } } }),
        signal: ctrl.signal
      });
      if (!res.ok) { const err = new Error("http"); err.status = res.status; throw err; }
      const data = await res.json();
      return data.id;
    } catch (e) {
      if (e && e.name === "AbortError") { const err = new Error("timeout"); err.status = "timeout"; throw err; }
      throw e;
    } finally { clearTimeout(to); }
  }
  function nowTime() { return new Date().toLocaleTimeString("zh-CN", { hour: "2-digit", minute: "2-digit" }); }
  async function pushSync() {
    if (!sync.enabled || !sync.token || !sync.room) return;
    suppressPush = true;
    setDot("busy", "同步中…");
    try {
      // 先拉后推，避免覆盖另一台设备的改动
      const remote = await gistFetchState();
      if (remote) {
        const r = applyDeleted(remote);
        state.stocks = mergeArr(state.stocks, r.stocks);
        state.trades = mergeArr(state.trades, r.trades);
        state.deleted = Array.from(new Set([...(state.deleted || []), ...(r.deleted || [])]));
        applyDeleted(state);
        save();
      }
      await gistPushState();
      sync.lastSeen = Date.now();
      saveSyncCfg();
      setDot("on", "已同步 · " + nowTime());
    } catch (e) {
      setDot("fail", syncErrMsg(e));
    } finally {
      suppressPush = false;
    }
  }
  async function pullSync() {
    if (!sync.enabled || !sync.token || !sync.room) return;
    suppressPush = true;
    setDot("busy", "同步中…");
    try {
      const remote = await gistFetchState();
      if (remote) {
        const r = applyDeleted(remote);
        state.stocks = mergeArr(state.stocks, r.stocks);
        state.trades = mergeArr(state.trades, r.trades);
        state.deleted = Array.from(new Set([...(state.deleted || []), ...(r.deleted || [])]));
        applyDeleted(state);
        sync.lastSeen = Date.now();
        saveSyncCfg();
        save();
        renderAll();
      }
      setDot("on", "已同步 · " + nowTime());
    } catch (e) {
      setDot("fail", syncErrMsg(e));
    } finally {
      suppressPush = false;
    }
  }
  function startSyncPolling() { stopSyncPolling(); sync.timer = setInterval(pullSync, 15000); }
  function stopSyncPolling() { if (sync.timer) { clearInterval(sync.timer); sync.timer = null; } }

  // ---------- 除息后成本价（与日历页同源：stock_dividends.json / fund_dividends.json） ----------
  // exMap[code] = [{ exDate:"YYYY-MM-DD", ps:Number }]；exDate ≤ 今天 的累计 ps 即应扣减的每股分红
  let exMap = {};
  async function loadExMap() {
    const norm = (recs, getEx, getPs) => (recs || []).map(r => ({ exDate: getEx(r), ps: getPs(r) })).filter(r => r.exDate);
    try {
      const [sj, fj] = await Promise.all([
        fetch("stock_dividends.json", { cache: "no-store" }).then(r => r.ok ? r.json() : null).catch(() => null),
        fetch("fund_dividends.json", { cache: "no-store" }).then(r => r.ok ? r.json() : null).catch(() => null)
      ]);
      const m = {};
      if (sj && sj.stocks) for (const code in sj.stocks) {
        m[code] = norm(sj.stocks[code].records, r => r.exDate, r => Number(r.ps) || 0);
      }
      if (fj && fj.funds) for (const code in fj.funds) {
        m[code] = (m[code] || []).concat(norm(fj.funds[code].records, r => r.exDate, r => Number(r.perUnit) || 0));
      }
      exMap = m;
      renderAll();
    } catch (e) { /* 拉取失败不影响原成本价展示 */ }
  }
  // 持仓起始日：最早一笔非基线买入；无真实交易记录则为 null（未知）
  function acquisitionDate(code) {
    const buys = (state.trades || [])
      .filter(t => (t.code || "") === code && t.type === "buy" && t.date && t.date !== "1900-01-01")
      .map(t => t.date).sort();
    return buys.length ? buys[0] : null;
  }
  // 累计「持有期间已除息」的每股红利之和（股票 + ETF 统一口径）
  // 有持仓起始日：只计 起始日之后、且已除息 的事件；未知起始日：回退近 365 天，避免把多年历史全扣掉
  function pastDividendPerShare(code) {
    const now = new Date();
    const td = now.getFullYear() + "-" + String(now.getMonth() + 1).padStart(2, "0") + "-" + String(now.getDate()).padStart(2, "0");
    const lo = new Date(now.getTime() - 365 * 86400000);
    const loStr = lo.getFullYear() + "-" + String(lo.getMonth() + 1).padStart(2, "0") + "-" + String(lo.getDate()).padStart(2, "0");
    const acq = acquisitionDate(code);
    const recs = exMap[code] || [];
    return recs.reduce((sum, r) => {
      if (!r.exDate || r.exDate > td) return sum;        // 尚未除息
      if (acq) { if (r.exDate <= acq) return sum; }       // 买入前已除息，未拿到
      else if (r.exDate < loStr) return sum;             // 未知起始日：只计近 365 天
      return sum + (Number(r.ps) || 0);
    }, 0);
  }

  // ---------- Effective stock metrics ----------
  // Returns per-stock effective shares/cost: manual overrides trade-computed
  function effectiveStock(s) {
    const { map } = compute();
    const h = map[s.code] || { qty: 0, avgCost: 0 };
    let shares = s.shares != null && s.shares !== "" ? Number(s.shares) : h.qty;
    let cost = s.cost != null && s.cost !== "" ? Number(s.cost) : (h.avgCost || 0);
    // 除息后成本价：原价 − 累计已除息每股分红（显示/P&L 用，原 cost 不变、不污染存储与多端同步）
    const pastDiv = pastDividendPerShare(s.code);
    const adjCost = cost > 0 ? Math.max(0, cost - pastDiv) : cost;
    return { shares, cost, adjCost, pastDiv };
  }

  // ---------- Render ----------
  function renderCatPills() {
    const sectors = ["全部", ...new Set(state.stocks.map(s=>s.sector).filter(Boolean))];
    $("#catPills").innerHTML = sectors.map(sec =>
      `<button class="pill ${sec===catFilter?"active":""}" data-cat="${escapeHtml(sec)}">${escapeHtml(sec)}</button>`
    ).join("");
  }

  function sortedStocks() {
    let list = state.stocks.slice();
    if (catFilter !== "全部") list = list.filter(s => s.sector === catFilter);
    if (sortBy === "yield") list.sort((a,b)=> {
      const ya = (Number(a.price)>0 && Number(a.dividend)>0) ? Number(a.dividend)/Number(a.price)*100 : 0;
      const yb = (Number(b.price)>0 && Number(b.dividend)>0) ? Number(b.dividend)/Number(b.price)*100 : 0;
      return yb - ya;
    });
    else if (sortBy === "dividend") list.sort((a,b)=> {
      const da = effectiveStock(a).shares * (Number(a.dividend)||0);
      const db = effectiveStock(b).shares * (Number(b.dividend)||0);
      return db - da;
    });
    else if (sortBy === "pnl") list.sort((a,b)=> {
      const pa = Number(a.price)||0, pb = Number(b.price)||0;
      const { shares: sa, adjCost: ca } = effectiveStock(a);
      const { shares: sb, adjCost: cb } = effectiveStock(b);
      const ra = ca > 0 ? ((pa-ca)/ca)*(sa>0?1:0) : -Infinity;
      const rb = cb > 0 ? ((pb-cb)/cb)*(sb>0?1:0) : -Infinity;
      return rb - ra;
    });
    return list;
  }

  function renderWatch() {
    const box = $("#watchlist");
    const list = sortedStocks();
    if (!list.length) {
      box.innerHTML = `<div class="empty"><div class="em-icon">📈</div><p>暂无股票<br/>点击「添加股票」开始记录</p></div>`;
      return;
    }
    const totalMV = state.stocks.reduce((sum,s)=> sum + effectiveStock(s).shares*(Number(s.price)||0), 0);
    const rows = list.map(s => {
      const { shares, cost, adjCost, pastDiv } = effectiveStock(s);
      const price = Number(s.price) || 0;
      const prev = Number(s.prevClose) || 0;
      const chg = prev > 0 ? (price - prev) / prev * 100 : null;
      const div = Number(s.dividend) || 0;
      const annualDiv = shares * div;
      const monthlyDiv = annualDiv / 12;
      const effYield = (price > 0 && div > 0) ? div / price * 100 : null;
      const pnl = shares > 0 ? (price - adjCost) * shares : 0;
      const pnlPct = adjCost > 0 ? (price - adjCost) / adjCost * 100 : 0;
      const mv = shares * price;
      const weight = totalMV > 0 ? mv / totalMV * 100 : 0;
      const costYield = cost > 0 ? ((Number(s.dividend)||0) / cost * 100) : 0;
      const tagHtml = s.tag ? `<span class="tag tag-blue">${escapeHtml(s.tag)}</span>` : "";
      const taxTag = s.taxFree ? `<span class="tag tag-gray">免税</span>` : "";
      const marketTag = s.currency === "HKD" ? `<span class="tag tag-blue">港股</span>` : (s.currency === "USD" ? `<span class="tag tag-blue">美股</span>` : "");
      const fundTag = s.fundType ? `<span class="tag tag-gray">${escapeHtml(s.fundType)}</span>` : "";
      const confirmTag = s.dividendConfirmed ? `<span class="tag tag-red">股息已确认</span>` : (Number(s.dividend) ? `<span class="tag tag-gray">预估</span>` : "");
      const chgHtml = chg != null ? `<div class="price-chg ${cls(chg)}">${sign(chg)}${fmt(chg,2)}%</div>` : "";
      return `
        <div class="stock-card" data-id="${s.id}">
          <div class="card-top">
            <div>
              <div class="stock-name">${escapeHtml(s.name)} <span class="code">${escapeHtml(s.code||"")}</span>${tagHtml}${marketTag}${fundTag}${confirmTag}</div>
              <div class="dividend-hint">每股红利 ¥${fmt(Number(s.dividend)||0,3)}</div>
            </div>
            <div class="stock-price">
              <div class="price-now">¥${fmt(price, isFundStock(s) ? 3 : 2)}</div>
              ${chgHtml}
            </div>
          </div>
          <div class="card-row">
            <div class="yield-left">
              <span class="tag tag-red" title="股息率 = 上一年度合计分红 ÷ 现价（TTM 口径）">${effYield != null ? fmt(effYield,2)+"%" : "—"}</span>
              ${taxTag}
            </div>
            <div class="cost-yield">成本股息率 ${fmt(costYield,2)}%</div>
          </div>
          <div class="yield-note">股息率(TTM) = 上一年度合计分红 ¥${fmt(div,3)} ÷ 现价 ¥${fmt(price,2)}</div>
          <div class="cost-note">${pastDiv > 0 ? `除息后成本价 ¥${fmt(adjCost, isFundStock(s)?3:2)}（已扣累计分红 ¥${fmt(pastDiv,3)}）` : `成本价 ¥${fmt(cost, isFundStock(s)?3:2)}`}</div>
          <div class="input-row">
            <div class="field-compact">
              <label>持股数量</label>
              <input type="number" step="1" data-shares="${s.id}" value="${shares > 0 ? shares : ""}" placeholder="0">
            </div>
            <div class="field-compact">
              <label>原始成本价</label>
              <input type="number" step="0.001" data-cost="${s.id}" value="${cost > 0 ? cost : ""}" placeholder="0.000">
            </div>
          </div>
          <div class="summary-pink">
            <div class="sum-item"><div class="sum-label">年红利</div><div class="sum-value">¥${fmt(annualDiv)}</div></div>
            <div class="sum-item"><div class="sum-label">月均</div><div class="sum-value">¥${fmt(monthlyDiv)}</div></div>
            <div class="sum-item"><div class="sum-label">持仓盈亏</div><div class="sum-value ${cls(pnl)}">${sign(pnl)}¥${fmt(pnl)} (${sign(pnlPct)}${fmt(pnlPct,2)}%)</div></div>
          </div>
          <div class="metrics-row">
            <span>持有市值 ¥${fmt(mv)}</span>
            <span>仓位占比 ${fmt(weight,1)}%</span>
            <span>总市值 ${Number(s.marketCap)?fmt(Number(s.marketCap))+'亿':'—'}</span>
          </div>
          <div class="card-footer">
            <button data-rec="${s.code || s.id}">☰ 记录</button>
            <button data-trades="${s.code || s.id}">📜 历史</button>
            <button data-matrix="${s.id}">⊞ 决策矩阵</button>
            <button data-refresh-stock="${s.id}">↻ 刷新</button>
            <button class="danger" data-del-stock="${s.id}">🗑 移除</button>
          </div>
        </div>`;
    }).join("");
    box.innerHTML = rows;
  }

  function renderTrades() {
    const { tradePnl } = compute();
    const box = $("#tradelist");
    if (!state.trades.length) {
      box.innerHTML = `<div class="empty"><div class="em-icon">🧾</div><p>还没有交易记录<br/>点击「记一笔」添加买入/卖出</p></div>`;
      return;
    }
    const ordered = state.trades.slice().sort((a,b)=> (b.date<a.date?-1:b.date<a.date?1:0));
    const rows = ordered.map(t => {
      const pnl = t.type === "sell" ? tradePnl[t.id] : null;
      const pnlCell = t.type === "sell"
        ? `<td class="${cls(pnl)}">${sign(pnl)}¥${fmt(pnl)}</td>`
        : `<td style="color:#9ca3af">—</td>`;
      const amount = t.price * t.qty;
      return `
        <tr>
          <td><div class="td-name">${escapeHtml(t.name)}</div><div class="td-sub">${escapeHtml(t.code||"")} · ${t.date}</div></td>
          <td><span class="tag-${t.type}">${t.type==="buy"?"买入":"卖出"}</span></td>
          <td class="mono">${fmt(t.price, priceDecimals(t.code))}</td>
          <td class="mono">${fmt(t.qty,0)}</td>
          <td class="mono">¥${fmt(amount)}</td>
          <td class="mono">¥${fmt(t.fee||0)}</td>
          ${pnlCell}
          <td><button class="link-like" data-del-trade="${t.id}">删除</button></td>
        </tr>`;
    }).join("");
    box.innerHTML = `<div class="table-card"><table>
      <thead><tr><th>股票</th><th>方向</th><th>价格</th><th>数量</th><th>金额</th><th>手续费</th><th>盈亏</th><th></th></tr></thead>
      <tbody>${rows}</tbody>

  // 根据 6 位代码判断市场前缀（修复：沪市 ETF/债券以 5 开头，曾被误判为深市 sz）
  function marketOf(code) {
    const c0 = code[0], c1 = code[1];
    if (c0 === "6" || c0 === "9") return "sh";            // 沪市 A/科创板、沪市 B
    if (c0 === "5") return "sh";                          // 沪市 ETF、沪市债券/可转债
    if (c0 === "8" || c0 === "4") return "bj";            // 北交所
    if (c0 === "1") return c1 === "1" ? "sh" : "sz";      // 11xxxx 上交所可转债→sh；其余(00/30/15/16/18/12)→sz
    return "sz";                                          // 默认深市
  }
  // 根据腾讯返回的类型字段(f[63])识别基金类，用于自动填充行业（股票为 GP-A 不填）
  function etfSectorOf(f) {
    const typ = (f[63] || "").toString().trim();
    if (/ETF/i.test(typ)) return "ETF";
    if (/LOF/i.test(typ)) return "LOF";
    if (/基金|FOF|QDII/i.test(typ)) return "基金";
    return "";
  }
  // 天天基金历史净值/分红数据（JSONP，免 CORS）：从 Data_netWorthTrend 的 unitMoney 字段提取
  // 「每份派现金X元」，累加「前一个日历年」所有分红得到每股(每份额)现金分红；用于基金类(ETF/LOF)的每股红利与股息率。
  function fetchFundDividend(code, cb) {
    const sc = document.createElement("script");
    let settled = false;
    const finish = (res) => { if (settled) return; settled = true; sc.remove(); cb(res); };
    sc.onerror = () => finish({ ok: false });
    sc.onload = function () {
      try {
        const arr = window.Data_netWorthTrend;
        if (!Array.isArray(arr) || !arr.length) return finish({ ok: false });
        const curYear = new Date().getFullYear();
        const byYear = {};
        for (const it of arr) {
          if (it.unitMoney) {
            const m = /每份派现金([\d.]+)元/.exec(it.unitMoney);
            if (!m) continue;
            let y = null;
            if (typeof it.x === "number") y = new Date(it.x).getFullYear();
            else if (it.date) y = new Date(String(it.date)).getFullYear();
            if (y != null) byYear[y] = (byYear[y] || 0) + parseFloat(m[1]);
          }
        }
        const years = Object.keys(byYear).map(Number).sort((a, b) => a - b);
        const prevYears = years.filter(y => y < curYear);
        const targetYear = prevYears.length ? prevYears[prevYears.length - 1] : (years.length ? years[years.length - 1] : null);
        const perUnit = targetYear != null ? byYear[targetYear] : 0;
        finish({ ok: true, perUnit, fiscalYear: targetYear });
      } catch (e) { finish({ ok: false }); }
    };
    sc.src = "https://fund.eastmoney.com/pingzhongdata/" + encodeURIComponent(code) + ".js";
    document.head.appendChild(sc);
  }
  // 股票每股分红：东方财富分红方案接口（datacenter-web，CORS 可用，与分红日历同源）。
  // 取「前一个财年（日历年）」所有分红方案合计的每股税前红利，而非最近一次单笔分红。
  function fetchStockDividend(code, cb) {
    const url = "https://datacenter-web.eastmoney.com/api/data/v1/get?reportName=RPT_SHAREBONUS_DET"
      + "&columns=ALL&filter=(SECURITY_CODE=\"" + encodeURIComponent(code) + "\")"
      + "&pageSize=60&pageNumber=1&sortColumns=REPORT_DATE&sortTypes=-1&source=WEB&client=WEB";
    fetch(url, { headers: { "User-Agent": "Mozilla/5.0" } })
      .then(r => r.json())
      .then(j => {
        const data = (j.result && j.result.data) || [];
        if (!data.length) return cb({ ok: false });
        const curYear = new Date().getFullYear();
        const fy = rec => { const d = rec.REPORT_DATE || rec.EX_DIVIDEND_DATE; return d ? new Date(String(d)).getFullYear() : null; };
        const byYear = {};
        data.forEach(r => {
          const y = fy(r);
          if (y == null || r.PRETAX_BONUS_RMB == null || isNaN(r.PRETAX_BONUS_RMB)) return;
          byYear[y] = (byYear[y] || 0) + Number(r.PRETAX_BONUS_RMB) / 10;
        });
        const years = Object.keys(byYear).map(Number).sort((a, b) => a - b);
        const prevYears = years.filter(y => y < curYear);
        const targetYear = prevYears.length ? prevYears[prevYears.length - 1] : (years.length ? years[years.length - 1] : null);
        if (targetYear != null && byYear[targetYear] > 0) {
          const rec = data.filter(r => fy(r) === targetYear)
            .sort((a, b) => String(b.EX_DIVIDEND_DATE || b.REPORT_DATE).localeCompare(String(a.EX_DIVIDEND_DATE || a.REPORT_DATE)))[0];
          cb({ ok: true, perShare: byYear[targetYear], plan: rec.IMPL_PLAN_PROFILE || "", exDate: rec.EX_DIVIDEND_DATE || "", fiscalYear: targetYear });
        } else {
          cb({ ok: false });
        }
      })
      .catch(() => cb({ ok: false }));
  }
  // 实时行情：选中/输入代码后通过腾讯 gtimg 接口（JSONP，免 CORS）自动带出价格、市值、股息率等
  function fetchQuote(code) {
    code = (code || "").trim();
    if (!/^\d{6}$/.test(code)) return;
    const mkt = marketOf(code);
    const gvar = "v_" + mkt + code;
    const url = "https://qt.gtimg.cn/q=" + mkt + code;
    const st = $("#quoteHint");
    st.textContent = "正在获取实时行情…";
    st.style.color = "var(--text-3)";
    const sc = document.createElement("script");
    sc.onload = function () {
      const raw = window[gvar];
      sc.remove();
      if (typeof raw !== "string" || !raw) {
        st.textContent = "实时行情获取失败，请手动填写"; st.style.color = "var(--primary)"; return;
      }
      const f = raw.replace(/^"+/, "").replace(/"+$/, "").split("~");
      const price = parseFloat(f[3]), prev = parseFloat(f[4]), cap = parseFloat(f[45]);
      const sec = etfSectorOf(f);
      const isFund = /^(ETF|LOF|基金)$/.test(sec);
      if (f[1] && !$("#sName").value) $("#sName").value = f[1];
      if (!isNaN(price)) {
        $("#sPrice").value = price.toFixed(isFund ? 3 : 2);
        $("#sPrice").step = isFund ? "0.001" : "0.01";
      }
      if (sec && !$("#sSector").value) {
        $("#sSector").value = sec;
        // 检测到 ETF/LOF/基金时，自动勾选「场内基金」
        if (isFund) {
          setCheck("sInFund", true);
          setCheck("sOutFund", false);
        }
      }
      const stamp = "已获取实时行情 · " + new Date().toLocaleTimeString("zh-CN", { hour: "2-digit", minute: "2-digit" });
      if (sec) {
        // 基金类（ETF/LOF/基金）：腾讯 f[64] 对基金为空，每股红利由天天基金历史分红数据计算
        fetchFundDividend(code, (r) => {
          if (r.ok && r.perUnit > 0) {
            $("#sDividend").value = r.perUnit.toFixed(4);
            st.textContent = stamp + " · 已抓" + (r.fiscalYear || "") + "年每股红利";
          } else if (r.ok) {
            $("#sDividend").value = "0";
            st.textContent = stamp + " · 上一财年无分红";
          } else {
            st.textContent = stamp + " · 分红获取失败，可手动填写";
          }
          st.style.color = "var(--down)";
        });
      } else if (!isNaN(price)) {
        // 股票类：东方财富分红方案接口抓取「前一财年合计每股红利」
        st.textContent = stamp + " · 正在抓取分红…";
        fetchStockDividend(code, (r) => {
          if (r.ok && r.perShare > 0) {
            $("#sDividend").value = r.perShare.toFixed(3);
            st.textContent = stamp + " · 已抓" + (r.fiscalYear || "") + "年合计每股红利";
          } else if (r.ok) {
            $("#sDividend").value = "0";
            st.textContent = stamp + " · 上一财年无分红";
          } else {
            // 兜底：用腾讯股息率TTM估算每股红利（仅当数值合理时，避免异常负值污染）
            const yld = parseFloat(f[64]);
            if (!isNaN(yld) && yld > 0 && yld < 30) {
              $("#sDividend").value = (yld * price / 100).toFixed(3);
              st.textContent = stamp + " · 已按股息率估算(兜底)";
            } else {
              st.textContent = stamp + " · 分红获取失败，可手动填写";
            }
          }
          st.style.color = "var(--down)";
        });
      } else {
        st.textContent = stamp;
        st.style.color = "var(--down)";
      }
    };
    sc.onerror = function () {
      sc.remove();
      st.textContent = "实时行情获取失败，请手动填写"; st.style.color = "var(--primary)";
    };
    sc.src = url; document.head.appendChild(sc);
  }
  // 把实时行情写入某个股票对象（供「刷新行情」复用），返回 Promise<boolean>
  function fetchQuoteInto(stock) {
    return new Promise((resolve) => {
      const code = (stock.code || "").trim();
      if (!/^\d{6}$/.test(code)) return resolve(false);
      const mkt = marketOf(code);
      const gvar = "v_" + mkt + code;
      const sc = document.createElement("script");
      sc.onload = function () {
        const raw = window[gvar]; sc.remove();
        if (typeof raw !== "string" || !raw) return resolve(false);
        const f = raw.replace(/^"+/, "").replace(/"+$/, "").split("~");
        const price = parseFloat(f[3]), prev = parseFloat(f[4]), cap = parseFloat(f[45]);
        if (!isNaN(price)) stock.price = price;
        if (!isNaN(prev)) stock.prevClose = prev;
        if (!isNaN(cap)) stock.marketCap = cap;
        const sec = etfSectorOf(f);
        if (sec && !stock.sector) stock.sector = sec;
        if (sec) {
          // 基金类：分红/股息率来自天天基金历史分红数据；已确认的红利不再覆盖
          fetchFundDividend(stock.code, (r) => {
            if (r.ok && r.perUnit > 0 && !stock.dividendConfirmed) {
              stock.dividend = r.perUnit;
            }
            const div = Number(stock.dividend) || 0;
            if (!isNaN(price) && price > 0 && div > 0) stock.yield = div / price * 100;
            resolve(true);
          });
        } else {
          // 股票类：刷新时重新抓取「前一财年合计每股红利」（仅未「股息已确认」时覆盖），让陈旧分红自愈
          const afterDiv = () => {
            const div = Number(stock.dividend) || 0;
            if (!isNaN(price) && price > 0 && div > 0) {
              stock.yield = div / price * 100;
            } else {
              stock.yield = null; // 无分红时不显示错误兜底值（腾讯 f[64] 异常时尤其重要）
            }
            resolve(true);
          };
          if (!stock.dividendConfirmed) {
            fetchStockDividend(stock.code, (r) => {
              if (r.ok && r.perShare > 0) stock.dividend = r.perShare;
              afterDiv();
            });
          } else {
            afterDiv();
          }
        }
      };
      sc.onerror = function () { sc.remove(); resolve(false); };
      sc.src = "https://qt.gtimg.cn/q=" + mkt + code; document.head.appendChild(sc);
    });
  }
  // 刷新全部持仓股票的实时行情

  function getMarketStatus(now) {

    const h = now.getHours(), m = now.getMinutes();
    const t = h * 60 + m;
    // 9:30-11:30, 13:00-15:00
    if ((t >= 570 && t < 690) || (t >= 780 && t < 900)) return { open: true, text: "交易中" };
    return { open: false, text: "休市中 · 显示收盘价" };

    if (!isNaN(price) && !isNaN(qty) && qty>0) {
      const amount = price*qty;
      el.textContent = tradeDir==="buy" ? `买入金额 ¥${fmt(amount)}，含手续费合计 ¥${fmt(amount+fee)}` : `卖出金额 ¥${fmt(amount)}，扣除手续费到账 ¥${fmt(amount-fee)}`;
    } else el.textContent = "";
  }
  ["tPrice","tQty","tFee"].forEach(id => $("#"+id).addEventListener("input", updateTradePreview));

  $("#tradeSave").onclick = () => {
    const code = $("#tStock").value.trim();
    if (!code) { toast("请先选择股票"); return; }
    const s = state.stocks.find(x=>x.code===code);
    const name = s ? s.name : code;
    const price = parseFloat($("#tPrice").value), qty = parseFloat($("#tQty").value), fee = parseFloat($("#tFee").value)||0;
    if (isNaN(price) || price<=0) { toast("请填写有效价格"); return; }
    if (isNaN(qty) || qty<=0) { toast("请填写有效数量"); return; }
    if (tradeDir==="sell") {
      const sv = state.stocks.find(x => (x.code||"") === code);
      const have = sv ? effectiveStock(sv).shares : 0;
      if (have < qty - 1e-6) {
        if (!confirm(`当前持仓约 ${fmt(have,0)} 股，卖出 ${fmt(qty,0)} 股将超过持仓，仍要记录吗？`)) return;
      }
    }
    // 首次记交易时若有手动持仓基线，先补「期初持仓」记录，保持数据一致
    ensureBaseline(code);
    state.trades.push({ id: uid(), code, name, type: tradeDir, date: $("#tDate").value||new Date().toISOString().slice(0,10), price, qty, fee, note: $("#tNote").value.trim() });
    syncHolding(code);
    save(); renderAll(); closeMask("tradeMask"); toast("已记录");
  };

  // ---------- 单只股票交易历史 ----------
  let histCode = null;
  function openTradeHist(code) {
    histCode = code;
    const s = state.stocks.find(x => (x.code || "") === code);
    $("#histTitle").textContent = (s ? s.name : code) + " · 交易历史";
    const eff = s ? effectiveStock(s) : { shares: 0, cost: 0 };
    $("#histSummary").textContent = eff.shares > 0
      ? `当前持仓 ${fmt(eff.shares,0)} 股 · 成本 ¥${fmt(eff.cost)}`
      : "当前无持仓";
    renderTradeHist();
    openMask("tradeHistMask");
  }
  function renderTradeHist() {
    const box = $("#histList");
    const list = state.trades.filter(t => (t.code || "") === histCode)
      .sort((a, b) => (b.date < a.date ? -1 : b.date > a.date ? 1 : (b.updatedAt||0) - (a.updatedAt||0)));
    if (!list.length) {
      box.innerHTML = `<div class="empty" style="padding:28px 0"><p style="font-size:13px;color:var(--text-3)">暂无交易记录</p></div>`;
      return;
    }
    box.innerHTML = list.map(t => {
      const amount = t.price * t.qty;
      return `<div class="hist-row">
        <div class="hist-left">
          <div><span class="tag-${t.type}">${t.type === "buy" ? "买入" : "卖出"}</span>
          <span class="hist-date">${t.date}</span></div>
          <div class="hist-sub">${fmt(t.price, priceDecimals(t.code))} × ${fmt(t.qty, 0)} 股${t.fee ? ` · 费 ¥${fmt(t.fee)}` : ""}</div>
          ${t.note ? `<div class="hist-note">${escapeHtml(t.note)}</div>` : ""}
        </div>
        <div class="hist-right">
          <div class="hist-amount">${t.type === "buy" ? "−¥" : "+¥"}${fmt(amount)}</div>
          <button class="link-like" data-del-trade="${t.id}">删除</button>
        </div>
      </div>`;
    }).join("");
  }
  $("#histAdd").addEventListener("click", () => { closeMask("tradeHistMask"); openTradeModal(histCode); });

  // ---------- Event delegation ----------
  document.addEventListener("click", e => {
    const st = e.target.closest("[data-del-stock]");
    const dt = e.target.closest("[data-del-trade]");
    const rec = e.target.closest("[data-rec]");
    const hist = e.target.closest("[data-trades]");
    const mat = e.target.closest("[data-matrix]");
    const ref = e.target.closest("[data-refresh-stock]");
    const sort = e.target.closest("[data-sort]");
    const cat = e.target.closest("[data-cat]");
    const close = e.target.closest("[data-close]");

    if (st) { const s=state.stocks.find(x=>x.id===st.dataset.delStock); if(confirm(`确定移除「${s?s.name:""}」？`)){ if(!Array.isArray(state.deleted)) state.deleted=[]; state.deleted.push(st.dataset.delStock); state.stocks=state.stocks.filter(x=>x.id!==st.dataset.delStock); save(); renderAll(); toast("已移除"); } return; }
    if (dt) { if(confirm("确定删除这笔交易记录？")){ if(!Array.isArray(state.deleted)) state.deleted=[]; state.deleted.push(dt.dataset.delTrade); state.trades=state.trades.filter(x=>x.id!==dt.dataset.delTrade); if(histCode) syncHolding(histCode); save(); renderAll(); if(histCode) openTradeHist(histCode); toast("已删除"); } return; }
    if (ref) { const s=state.stocks.find(x=>x.id===ref.dataset.refreshStock); if(s){ const btn=e.target; btn.disabled=true; btn.textContent="…"; fetchQuoteInto(s).then(ok=>{ if(ok){ save(); renderAll(); toast(`已刷新 ${s.name}`); } else { toast("刷新失败"); renderAll(); } }); } return; }
    if (rec) { openTradeModal(rec.dataset.rec); return; }
    if (hist) { openTradeHist(hist.dataset.trades); return; }
    if (mat) { location.href = "matrix.html?id=" + encodeURIComponent(mat.dataset.matrix); return; }
    if (sort) { sortBy=sort.dataset.sort; $$("[data-sort]").forEach(b=>b.classList.toggle("active", b===sort)); renderWatch(); return; }
    if (cat) { catFilter=cat.dataset.cat; renderCatPills(); renderWatch(); return; }
    if (close) { closeMask(close.dataset.close); return; }
    if (e.target.classList.contains("mask")) closeMask(e.target.id);
  });

  // Inline inputs on cards
  document.addEventListener("input", e => {
    if (e.target.dataset.shares) {
      const s = state.stocks.find(x=>x.id===e.target.dataset.shares);
      if (s) { s.shares = e.target.value===""?null:Number(e.target.value); save(); renderWatch(); }
    }
    if (e.target.dataset.cost) {
      const s = state.stocks.find(x=>x.id===e.target.dataset.cost);
      if (s) { s.cost = e.target.value===""?null:Number(e.target.value); save(); renderWatch(); }
    }
  });

  // Nav
  $("#navWatch").onclick = () => switchView("watch");
  $("#navTrade").onclick = () => switchView("trade");

  // 刷新行情
  $("#btnRefresh").onclick = refreshAllQuotes;

  // 同步
  $("#btnSync").onclick = () => {
    $("#syncToken").value = sync.token || "";
    $("#syncRoom").value = sync.room || "";
    $("#syncDevice").value = sync.device || "";
    $("#syncStatus").textContent = sync.enabled
      ? "同步已开启 · 每 15 秒自动拉取，本地修改即时推送"
      : "未开启同步 · 数据仅保存在本机浏览器";
    openMask("syncMask");
  };
  $("#syncEnable").onclick = async () => {
    const token = $("#syncToken").value.trim();
    const enteredRoom = $("#syncRoom").value.trim();
    const device = $("#syncDevice").value.trim() || "本机";
    if (!token) { toast("请填写 GitHub 令牌"); return; }
    sync.enabled = true; sync.token = token; sync.device = device;
    let created = false;
    if (!enteredRoom) {
      try {
        setDot("busy", "正在创建同步仓库…");
        const id = await gistCreate();
        sync.room = id; created = true;
      } catch (e) {
        sync.enabled = false; setDot("fail", "同步失败：GitHub 不可达或令牌无 gist 权限"); toast("创建失败：GitHub 不可达或令牌无 gist 权限"); return;
      }
    } else {
      sync.room = enteredRoom;
    }
    saveSyncCfg();
    $("#syncRoom").value = sync.room;
    closeMask("syncMask");
    toast(created ? ("已生成同步码：" + sync.room + "（请抄到另一台设备）") : "正在同步…");
    pullSync().then(startSyncPolling);
  };
  $("#syncDisable").onclick = () => {
    sync.enabled = false; saveSyncCfg(); stopSyncPolling(); setDot("", "未同步");
    closeMask("syncMask"); toast("已关闭同步");
  };

  // Export / Import
  $("#btnExport").onclick = () => {
    const blob = new Blob([JSON.stringify(state,null,2)], {type:"application/json"});
    const a = document.createElement("a"); a.href=URL.createObjectURL(blob);
    a.download = "股票记账_" + new Date().toISOString().slice(0,10) + ".json"; a.click(); URL.revokeObjectURL(a.href); toast("已导出");
  };
  $("#btnImport").onclick = () => $("#fileImport").click();
  $("#fileImport").onchange = e => {
    const f=e.target.files[0]; if(!f) return;
    const r=new FileReader();
    r.onload = () => { try{ const data=JSON.parse(r.result); if(!data.stocks||!data.trades) throw 0; if(confirm("导入将覆盖当前数据，确定继续？")){ state=data; save(); renderAll(); toast("导入成功"); } }catch(err){ toast("文件格式不正确"); } };
    r.readAsText(f); e.target.value="";
  };

  // Seed sample matching screenshot
  if (!localStorage.getItem(KEY)) {
    state = {
      stocks: [
        { id: uid(), name: "中国核电", code: "601985", sector: "电力", tag: "央企", price: 8.80, prevClose: 8.83, dividend: 0.180, yield: 2.05, marketCap: 1810, shares: 1000, cost: 7.120, taxFree: false, note: "" },
        { id: uid(), name: "华能国际", code: "600011", sector: "电力", tag: "央企", price: 6.99, prevClose: 7.01, dividend: 0.400, yield: 5.72, marketCap: 1097, shares: 1700, cost: 7.350, taxFree: false, note: "" }
      ],
      trades: [
        { id: uid(), code: "601985", name: "中国核电", type: "buy", date: "2026-01-10", price: 7.12, qty: 1000, fee: 7.12, note: "" },
        { id: uid(), code: "600011", name: "华能国际", type: "buy", date: "2026-02-05", price: 7.35, qty: 1700, fee: 12.50, note: "" }
      ],
      deleted: []
    };
    save();
  }

  // 初始化同步
  loadSyncCfg();
  // 清掉旧版（workers.dev）遗留的无效同步配置：没有令牌则视为未启用
  if (sync.enabled && !sync.token) { sync.enabled = false; saveSyncCfg(); }
  if (sync.enabled) {
    setDot("busy", "同步中…");
    pullSync().then(() => { if (sync.enabled) startSyncPolling(); });
  } else {
    setDot("", "未同步");
  }

  updateMarketStatus();
  setInterval(updateMarketStatus, 60000);
  loadRefreshSetting();
  startAutoRefresh();
  loadExMap();

  switchView("watch");
})();

  document.addEventListener("visibilitychange", () => { if (!document.hidden && sync.enabled && sync.token && sync.room) pullSync(); });
  window.addEventListener("online", () => { if (sync.enabled && sync.token && sync.room) pullSync(); });
</script>
