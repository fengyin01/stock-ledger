name: 刷新股票分红快照

on:
  schedule:
    - cron: '0 18 * * *'   # 每天 UTC 18:00 = 北京时间 02:00
  workflow_dispatch: {}    # 支持手动触发

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 抓取分红快照（全量重抓，捕捉新公告）
        env:
          GH_ACTIONS: '1'
        run: node fetch_my_stocks.js

      - name: 提交更新
        run: |
          git config user.name "dividend-bot"
          git config user.email "bot@users.noreply.github.com"
          git add stock_dividends.json
          if git diff --cached --quiet; then
            echo "无变化，跳过提交"
          else
            git commit -m "chore: 自动刷新股票分红快照 $(date +%F)"
            git push
          fi
