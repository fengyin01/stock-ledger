<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
<meta http-equiv="Pragma" content="no-cache" />
<meta http-equiv="Expires" content="0" />
<title>慢慢变富 · 新闻</title>
<style>
  :root {
    --primary: #E03025;
    --primary-soft: #fff0f0;
    --up: #E03025;
    --down: #16a34a;
    --bg: #f3f4f6;
    --card: #ffffff;
    --border: #e5e7eb;
    --text: #1f2937;
    --text-2: #6b7280;
    --text-3: #9ca3af;
    --radius: 12px;
    --radius-lg: 16px;
    --shadow: 0 1px 2px rgba(0,0,0,.04), 0 1px 3px rgba(0,0,0,.06);
    --font: -apple-system, BlinkMacSystemFont, "PingFang SC", "Helvetica Neue", sans-serif;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    font-family: var(--font); background: var(--bg); color: var(--text);
    font-size: 14px; line-height: 1.5; -webkit-font-smoothing: antialiased;
    padding-bottom: calc(120px + env(safe-area-inset-bottom));
  }
  .wrap { max-width: 720px; margin: 0 auto; padding: 0 16px calc(40px + env(safe-area-inset-bottom)); }

  .topbar {
    position: sticky; top: 0; z-index: 30;
    background: rgba(255,255,255,.92); backdrop-filter: saturate(180%) blur(10px);
    border-bottom: 1px solid var(--border);
  }
  .topbar-inner {
    max-width: 720px; margin: 0 auto; padding: 12px 16px;
    display: flex; align-items: center; gap: 12px;
  }
  .topbar h1 { font-size: 17px; font-weight: 700; flex: 1; }
  .btn-refresh {
    font-family: var(--font); font-size: 13px; color: var(--text-2);
    background: var(--bg); border: 1px solid var(--border); border-radius: 8px;
    padding: 6px 12px; cursor: pointer; transition: background .15s, color .15s;
    -webkit-tap-highlight-color: transparent;
  }
  .btn-refresh:hover { background: var(--border); color: var(--text); }
  .btn-refresh:disabled { opacity: .6; cursor: not-allowed; }

  .status-line { display: flex; align-items: center; gap: 8px; margin: 14px 0 4px; font-size: 12px; color: var(--text-2); }
  .status-line .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--text-3); flex: 0 0 auto; }
  .status-line .dot.busy { background: var(--down); animation: pulse 1s ease-in-out infinite; }
  @keyframes pulse { 0%,100% { opacity: .35; } 50% { opacity: 1; } }
  .status-line .dot.done { background: var(--down); }
  .status-line .dot.fail { background: var(--up); }

  .news-section {
    background: var(--card); border: 1px solid var(--border);
    border-radius: var(--radius-lg); box-shadow: var(--shadow);
    margin-top: 14px; overflow: hidden;
  }
  .news-head {
    display: flex; align-items: baseline; gap: 8px;
    padding: 12px 16px; border-bottom: 1px solid var(--border);
    background: var(--primary-soft);
  }
  .news-head .news-name { font-size: 15px; font-weight: 800; color: var(--primary); }
  .news-head .news-code { font-size: 12px; color: var(--text-2); }
  .news-head .news-count { margin-left: auto; font-size: 12px; color: var(--text-3); }
  .news-list { padding: 4px 0; }
  .news-item {
    display: block; padding: 12px 16px; border-bottom: 1px solid var(--border);
    text-decoration: none; color: var(--text); -webkit-tap-highlight-color: transparent;
    transition: background .15s;
  }
  .news-item:last-child { border-bottom: none; }
  .news-item:hover, .news-item:active { background: #fafafa; }
  .news-item.no-link { cursor: default; }
  .news-item.no-link:hover { background: none; }
  .news-title { font-size: 14px; font-weight: 600; line-height: 1.45; }
  .news-item:hover .news-title, .news-item:active .news-title { color: var(--primary); }
  .news-meta { font-size: 12px; color: var(--text-3); margin-top: 4px; font-variant-numeric: tabular-nums; }
  .news-empty { padding: 18px 16px; font-size: 13px; color: var(--text-3); text-align: center; }
  .news-loading { padding: 18px 16px; font-size: 13px; color: var(--text-3); text-align: center; }

  .empty-state { text-align: center; padding: 60px 20px; color: var(--text-3); }
  .empty-state p { margin-top: 8px; font-size: 13px; }
  .empty-state a { color: var(--primary); text-decoration: none; font-weight: 600; }

  /* 底部导航 */
  .bottom-nav {
    box-sizing: border-box;
    position: fixed; bottom: 0; left: 0; right: 0; z-index: 100;
    height: calc(56px + env(safe-area-inset-bottom));
    padding-bottom: env(safe-area-inset-bottom);
    background: #fff; border-top: 1px solid var(--border);
    display: flex; justify-content: space-around; align-items: flex-start;
  }
  .bottom-nav a {
    flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center;
    height: 56px; gap: 3px; color: var(--text-3); text-decoration: none; font-size: 11px;
    -webkit-tap-highlight-color: transparent; transition: color .15s;
  }
  .bottom-nav a.active { color: var(--primary); font-weight: 600; }
  .bottom-nav svg {
    width: 22px; height: 22px; stroke: currentColor; stroke-width: 1.8; fill: none;
    stroke-linecap: round; stroke-linejoin: round; transition: stroke .15s;
  }
  .bottom-nav a .icon-fill { fill: currentColor; stroke: none; }
  @media (max-width: 360px) {
    .bottom-nav a { font-size: 10px; }
    .bottom-nav svg { width: 20px; height: 20px; }
  }
</style>
</head>
<body>

<div class="topbar">
  <div class="topbar-inner">
    <h1>新闻</h1>
    <button class="btn-refresh" id="btnRefresh">刷新</button>
  </div>
</div>

<div class="wrap">
  <div class="status-line" id="statusLine" hidden>
    <span class="dot" id="statusDot"></span>
    <span id="statusText"></span>
  </div>
  <div id="sections"></div>
</div>

<nav class="bottom-nav">
  <a href="index.html">
    <svg viewBox="0 0 24 24" class="icon-fill"><circle cx="12" cy="12" r="6"/></svg>
    <span>持仓</span>
  </a>
  <a href="watchlist.html">
    <svg viewBox="0 0 24 24"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></svg>
    <span>自选</span>
  </a>
  <a href="returns.html">
    <svg viewBox="0 0 24 24"><polyline points="22 12 18 12 15 21 9 3 6 12 2 12"/></svg>
    <span>收益</span>
  </a>
  <a href="sectors.html">
    <svg viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg>
    <span>板块</span>
  </a>
  <a href="news.html" class="active">
    <svg viewBox="0 0 24 24"><path d="M4 6a2 2 0 0 1 2-2h12a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6z"/><line x1="8" y1="10" x2="16" y2="10"/><line x1="8" y1="14" x2="16" y2="14"/><line x1="8" y1="6" x2="8" y2="18"/></svg>
    <span>新闻</span>
  </a>
  <a href="calendar.html">
    <svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
    <span>日历</span>
  </a>
</nav>

<script>
(function () {
  const KEY = "mmbf_stock_ledger_v2";
  const NEWS_SIZE = 5;
  const $ = id => document.getElementById(id);

  function loadState() {
    try {
      const raw = localStorage.getItem(KEY);
      if (!raw) return {};
      const s = JSON.parse(raw);
      return s || {};
    } catch (e) { return {}; }
  }
  // 持仓股票/ETF：优先展示有代码或名称的
  const state = loadState();
  const stocks = (state.stocks || []).filter(s => (s.code || s.name));

  function esc(s) {
    return String(s == null ? "" : s)
      .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;").replace(/'/g, "&#39;");
  }
  function stripHtml(s) {
    return String(s || "")
      .replace(/<[^>]*>/g, "")
      .replace(/&amp;/g, "&").replace(/&quot;/g, "\"").replace(/&#39;/g, "'")
      .replace(/&lt;/g, "<").replace(/&gt;/g, ">").replace(/&nbsp;/g, " ");
  }

  // 东方财富搜索接口（JSONP，免 CORS）：按股票名称/代码抓取最新新闻
  let seq = 0;
  function fetchNews(keyword) {
    return new Promise(resolve => {
      const fn = "emNews_" + (++seq);
      let done = false;
      const finish = items => { if (done) return; done = true; cleanup(); resolve(items); };
      function cleanup() {
        clearTimeout(timer);
        try { delete window[fn]; } catch (e) {}
        try { sc.remove(); } catch (e) {}
      }
      window[fn] = data => {
        let items = [];
        try { items = (data && data.result && data.result.cmsArticleWebOld) || []; } catch (e) {}
        finish(items);
      };
      const timer = setTimeout(() => finish([]), 9000);
      const param = encodeURIComponent(JSON.stringify({
        uid: "", keyword, type: ["cmsArticleWebOld"],
        client: "web", clientType: "web", clientVersion: "curr",
        param: { cmsArticleWebOld: { searchScope: "default", sort: "default", pageIndex: 1, pageSize: NEWS_SIZE, preTag: "", postTag: "" } }
      }));
      const sc = document.createElement("script");
      sc.onerror = () => finish([]);
      sc.src = "https://search-api-web.eastmoney.com/search/jsonp?cb=" + fn + "&param=" + param;
      document.head.appendChild(sc);
    });
  }

  function sectionHtml(s, items) {
    const name = s.name || s.code || "未命名";
    const code = s.code ? "(" + esc(s.code) + ")" : "";
    if (!items.length) {
      return '<div class="news-section">' +
        '<div class="news-head"><span class="news-name">' + esc(name) + '</span><span class="news-code">' + code + '</span>' +
        '<span class="news-count">0 条</span></div>' +
        '<div class="news-empty">暂无相关新闻</div></div>';
    }
    const rows = items.map(it => {
      const title = esc(stripHtml(it.title)) || "（无标题）";
      const meta = esc((it.mediaName || "东方财富") + " · " + String(it.date || "").slice(0, 10));
      const url = String(it.url || "").trim();
      if (!url) {
        return '<div class="news-item no-link"><div class="news-title">' + title + '</div><div class="news-meta">' + meta + '</div></div>';
      }
      return '<a class="news-item" href="' + esc(url) + '" target="_blank" rel="noopener">' +
        '<div class="news-title">' + title + '</div><div class="news-meta">' + meta + '</div></a>';
    }).join("");
    return '<div class="news-section">' +
      '<div class="news-head"><span class="news-name">' + esc(name) + '</span><span class="news-code">' + code + '</span>' +
      '<span class="news-count">' + items.length + ' 条</span></div>' +
      '<div class="news-list">' + rows + '</div></div>';
  }

  function setStatus(cls, text) {
    const line = $("statusLine");
    line.hidden = false;
    $("statusDot").className = "dot" + (cls ? " " + cls : "");
    $("statusText").textContent = text;
  }

  async function loadAll() {
    if (!stocks.length) {
      $("sections").innerHTML =
        '<div class="empty-state"><div style="font-size:40px">📰</div><p>持仓为空</p>' +
        '<p>请先到<a href="index.html">持仓页</a>添加股票或 ETF</p></div>';
      $("statusLine").hidden = true;
      return;
    }
    const btn = $("btnRefresh");
    btn.disabled = true;
    // 先渲染骨架：每只股票显示「加载中」
    $("sections").innerHTML = stocks.map(s =>
      '<div class="news-section"><div class="news-head"><span class="news-name">' + esc(s.name || s.code || "未命名") +
      '</span><span class="news-code">' + (s.code ? "(" + esc(s.code) + ")" : "") + '</span>' +
      '<span class="news-count">…</span></div><div class="news-loading">正在获取新闻…</div></div>'
    ).join("");
    setStatus("busy", "正在获取 " + stocks.length + " 只股票的新闻…");
    let done = 0, ok = 0;
    for (const s of stocks) {
      const keyword = String(s.name || s.code || "").trim() || String(s.code || "").trim();
      const items = keyword ? await fetchNews(keyword) : [];
      if (items.length) ok++;
      done++;
      // 只替换对应区块
      const secs = $("sections").querySelectorAll(".news-section");
      const target = secs[done - 1];
      if (target) {
        const holder = document.createElement("div");
        holder.innerHTML = sectionHtml(s, items);
        target.replaceWith(holder.firstChild);
      }
      setStatus("busy", "已获取 " + done + " / " + stocks.length + " 只…");
    }
    btn.disabled = false;
    setStatus(ok === stocks.length ? "done" : (ok > 0 ? "done" : "fail"),
      "完成 · " + ok + " / " + stocks.length + " 只有新闻");
  }

  // ---------- 交易日每小时自动刷新 ----------
  // 交易日：周一至周五（与持仓页的休市判断保持一致，不区分法定节假日）
  function isTradingDay() {
    const d = new Date();
    const day = d.getDay(); // 0=周日 6=周六
    return day !== 0 && day !== 6;
  }
  const AUTO_MS = 60 * 60 * 1000; // 1 小时
  let lastAutoLoad = Date.now();
  function autoRefresh() {
    if (document.hidden) return;         // 后台不刷新
    if (!isTradingDay()) return;         // 非交易日不刷新
    if (Date.now() - lastAutoLoad < AUTO_MS) return; // 距上次自动刷新不足 1 小时
    lastAutoLoad = Date.now();
    loadAll();
  }
  setInterval(autoRefresh, AUTO_MS);
  // 切回前台：若已超过 1 小时未自动刷新则补刷一次
  document.addEventListener("visibilitychange", () => {
    if (!document.hidden) autoRefresh();
  });

  $("btnRefresh").addEventListener("click", loadAll);
  loadAll();
})();
</script>
</body>
</html>
